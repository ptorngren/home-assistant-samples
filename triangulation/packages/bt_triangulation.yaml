# Bluetooth Triangulation Package
# Reusable Bluetooth beacon triangulation system for device location detection
# Provides fingerprint collection, RSSI matching, location scoring, and ambiguity diagnostics
# Can be used standalone or integrated with screensaver (via screensaver_local.yaml bridge)
# ------------------------------------------------------------------

input_text:
  bt_calibration_locations:
    name: "BT Calibration Locations"
    icon: mdi:text-box-edit-outline
    max: 255
    # User-editable location list (e.g., "office, kitchen, garage, bedroom, ...")
    # Template sensor bt_location_array parses this once and stores as indexable array
    # Accessible via: state_attr('sensor.bt_location_array', 'locations')[index]

  bt_matrix_selected_pair:
    name: "BT Matrix Selected Pair"
    icon: mdi:table-eye
    max: 255
    initial: ""
    # Stores selected confusion matrix cell as "row_loc|col_loc" (pipe-separated location names)
    # Empty string = no selection. Written by matrix cell tap actions in the dashboard.

  bt_range_editor_context:
    name: "BT Range Editor Context"
    max: 50
    initial: ""
    # Temporary storage for range editor popup. Format: "location_index|mac|tolerance|current_min|current_max|p10|p90|n"

  bt_device_charger_locations:
    name: "Device Charger Locations"
    max: 255
    initial: "{}"
    # Stores JSON mapping of device_ids to charger locations: {"peers_mobil": "peer", "device_id_2": "kök", ...}
    # NOTE: 'initial' resets this on HA restart, but that's acceptable because:
    # 1. Mapping is only valid while phone is on charger (cleared on power disconnect)
    # 2. Mapping is repopulated by every webhook (BT scan), so brief reset on restart doesn't matter
    # 3. Edge case (HA restart with phone on charger) is rare and self-corrects on next BT scan

input_number:
  bt_weak_signal_threshold:
    name: "Weak Signal Threshold"
    unit_of_measurement: "dBm"
    min: -105
    max: -60
    step: 1
    mode: slider
    # Signals weaker than this are treated as missing/unreliable
    # Prevents volatile weak signals from affecting location detection
    # NOTE: No 'initial:' to prevent forced resets on HA restart
    # Helper starts empty, so user must set this value manually in the UI unless the algorithm uses a default value

  bt_rssi_tolerance:
    name: "RSSI Match Tolerance"
    unit_of_measurement: "dBm"
    min: 0
    max: 20
    step: 1
    mode: slider
    # Tolerance for matching beacon RSSI in scan against fingerprint RSSI
    # Beacon counts as match only if scan RSSI is within ±N dBm of fingerprint RSSI
    # Higher values = more lenient matching, lower values = stricter RSSI matching

  bt_diagnostic_location_count:
    name: "Diagnostic Location Count"
    min: 1
    max: 5
    step: 1
    mode: slider
    # Number of top-scoring locations to show in the per-beacon breakdown card
    # Useful for diagnosing why one location wins over another

  bt_range_editor_min:
    name: "BT Range Editor Min"
    unit_of_measurement: "dBm"
    min: -120
    max: 0
    step: 1
    mode: box
    # Temporary storage for range editor popup — min bound being edited

  bt_range_editor_max:
    name: "BT Range Editor Max"
    unit_of_measurement: "dBm"
    min: -120
    max: 0
    step: 1
    mode: box
    # Temporary storage for range editor popup — max bound being edited

input_boolean:
  bt_filter_zero_rssi_signals:
    name: "Ignore Ghost Signals (0 dBm)"
    icon: mdi:ghost-off
    # When ON: exclude RSSI=0 beacons (zero-strength signals with no measurable distance)
    # When OFF: include RSSI=0 beacons in scan processing
  bt_include_random_macs:
    name: "Include Random MACs"
    icon: mdi:shuffle-variant
    # When OFF (default): exclude randomly generated / locally administered MACs from scan processing
    # These are privacy-mode devices (iPhones, Android privacy mode) whose MACs rotate over time
    # and are never reliable fingerprint anchors. Detected by bit 1 of first octet being set.
    # When ON: include all MACs regardless of type (e.g. for debugging)
  bt_fingerprint_minmax_mode:
    name: "Min/Max Fingerprint Mode"
    icon: mdi:arrow-expand-horizontal
    # When ON: capture/merge writes min/max bounds instead of running-mean RSSI
    # When OFF (default): existing running-mean behavior
    # Mode detection is data-driven: presence of 'min' key in beacon dict determines matching
    # Mixed fingerprints work per-entry — switching OFF does not revert existing min/max entries
  bt_distance_weighted_scoring:
    name: "Distance-Weighted Scoring"
    icon: mdi:chart-bell-curve
    # When ON: matched score is a continuous quality (0.0–1.0) based on how centered scan RSSI
    # is within the fingerprint range — midpoint scores 1.0, edges score 0.0, outside scores 0.
    # Breaks ties between locations that share beacons but at different RSSI ranges.
    # When OFF (default): binary matching — in range = 1, out of range = 0

# Shell commands for file-based persistence (fingerprint database and BT scan data)
# Note: Using | base64_encode filter to safely preserve multiline content and special characters in device names
shell_command:
  # `allow-shrink` reaches the persistor only when the caller means to remove entries. Without it the
  # persistor refuses any write holding fewer entries than the file already does, which is what a
  # document rebuilt from a sensor that could not read its file looks like.
  bt_fingerprint_database_write: >-
    bash /config/packages/triangulation/bt_fingerprints_persistor.sh write fingerprints
    "{{ json_content | to_json | base64_encode }}" {{ 'allow-shrink' if allow_shrink | default(false) | bool(false) else '' }}
  bt_fingerprint_database_read: 'bash /config/packages/triangulation/bt_fingerprints_persistor.sh read fingerprints'
  # Restoring a beacon from the global ignore list is the one routine shrink in the package, so this
  # command carries the flag too.
  bt_ignored_write: >-
    bash /config/packages/triangulation/bt_fingerprints_persistor.sh write ignored
    "{{ json_content | to_json | base64_encode }}" {{ 'allow-shrink' if allow_shrink | default(false) | bool(false) else '' }}
  bt_ignored_read: 'bash /config/packages/triangulation/bt_fingerprints_persistor.sh read ignored'
  # No flag: nothing shrinks statistics through the persistor - bt_clear_statistics bypasses it.
  bt_statistics_write: 'bash /config/packages/triangulation/bt_fingerprints_persistor.sh write statistics "{{ json_content | to_json | base64_encode }}"'
  # Wrapped in bash -c: without a template in the command, HA runs shell_command through exec
  # rather than a shell, so && and > would be passed to mkdir as literal arguments.
  #
  # The one write that deliberately bypasses the persistor, and so has neither the atomic temp-file
  # write nor the refusal guard. That is the point: the persistor refuses to overwrite a file that
  # does not parse, which would make a corrupt statistics file permanently unclearable - and clearing
  # it is exactly the repair. A truncating redirect is safe here because the payload is a fixed
  # literal that cannot fail to serialise, and the data is regenerable by re-merging.
  # Do not route this through script.bt_persist_write.
  bt_statistics_clear: 'bash -c "mkdir -p /config/packages/triangulation/data && echo ''{\"statistics\":[]}'' > /config/packages/triangulation/data/bt_statistics.json"'

# ------------------------------------------------------------------
# BT SENSORS (Command-line integration)
# ------------------------------------------------------------------
# BT Latest Scan Full sensor is now webhook-triggered template sensor (see template section)
# Other sensors read from file (fingerprints, location scores, ignored beacons)
# ------------------------------------------------------------------
#
# POLLING — why every command_line sensor here says scan_interval: 86400
# ------------------------------------------------------------------
# Each of these sensors reads a file this package writes, and every writer refreshes the
# sensor it affects with homeassistant.update_entity, which works whatever the interval
# is. Polling therefore only ever re-runs a command against an unchanged file, and each
# run spawns a bash plus a python3 to re-read and re-sort the whole file.
#
# A day is as close to "never" as this integration allows. command_line has no way to
# switch polling off — the toggle under an integration's System options exists only for
# UI/config-flow integrations, not YAML platform entities — and omitting scan_interval
# selects the 60-second default instead, which is why every sensor here sets it.
# ------------------------------------------------------------------
command_line:
  - sensor:
      name: "BT Fingerprint Database File"
      unique_id: bt_fingerprint_database_file
      command: 'bash /config/packages/triangulation/bt_fingerprints_persistor.sh read fingerprints'
      json_attributes:
        - fingerprints
      value_template: "{% if value_json.fingerprints %}ready{% else %}empty{% endif %}"
      scan_interval: 86400   # effectively never — see POLLING above
      # Reads fingerprints from file and wraps in JSON object for attributes extraction
      # Refreshed by script.bt_persist_write after every write, and at HA startup
      # Dashboard/scripts access via: state_attr('sensor.bt_fingerprint_database_file', 'fingerprints')
      # Pattern: File + Sensor Attributes (unlimited data, no 255-char limit)

  - sensor:
      name: "BT Ignored Beacons"
      unique_id: bt_ignored
      command: 'bash /config/packages/triangulation/bt_fingerprints_persistor.sh read ignored'
      json_attributes:
        - ignored
      value_template: "{% if value_json.ignored %}{{ value_json.ignored | length }}{% else %}0{% endif %}"
      scan_interval: 86400   # effectively never — see POLLING above
      # Reads globally excluded beacon MACs from file (supports 100+ beacons)
      # Refreshed by script.bt_persist_write after every write
      # Stores as JSON array in attributes: state_attr('sensor.bt_ignored_beacons', 'ignored')
      # Pattern: File + Sensor Attributes (unlimited data, no 255-char limit)

  - sensor:
      name: "BT Merge Statistics"
      unique_id: bt_merge_statistics
      command: 'bash /config/packages/triangulation/bt_fingerprints_persistor.sh read statistics'
      json_attributes:
        - statistics
      value_template: "{% if value_json.statistics %}{{ value_json.statistics | length }}{% else %}0{% endif %}"
      scan_interval: 86400   # effectively never — see POLLING above
      # Per-beacon RSSI sample history from capture/merge operations (file-backed, unlimited size)
      # Refreshed by script.bt_persist_write after every write, and by script.bt_clear_statistics
      # Format: statistics[].loc + beacons{MAC: [[rssi, timestamp], ...]} — null rssi = beacon absent in that session
      # Dashboard access: state_attr('sensor.bt_merge_statistics', 'statistics')

# Computed sensors (Template integration)
template:
  - sensor:
      # How a browser id becomes the device key used in the charger-location mapping: a kiosk browser
      # registers under a decorated id (Fully Kiosk Browser appends `_fkb`) and the pattern's capture
      # group is the plain device. Read by the detection and disconnect scripts, by the screensaver's
      # tap routing, and by sensor.screensaver_display_config where that package is installed too.
      - name: "Dashboard Logic Config"
        unique_id: dashboard_logic_config
        state: "ready"
        attributes:
          browser_id_transform_pattern: "^(.+?)(?:_fkb)?$"

      # Active Known Beacons - single source of truth for which beacons are active
      # A beacon is active if it appears non-ignored in at least one location fingerprint
      # Auto-updates when fingerprints or ignore list change
      - name: "BT Active Known Beacons"
        unique_id: bt_active_known_beacons
        icon: mdi:bluetooth
        state: >
          {%- set ns = namespace(macs=[]) -%}
          {%- set global_ignored = (state_attr('sensor.bt_ignored_beacons', 'ignored') or []) | map('upper') | list -%}
          {%- set fingerprints = state_attr('sensor.bt_fingerprint_database_file', 'fingerprints') or [] -%}
          {%- for fp in fingerprints -%}
            {%- if fp.beacons is not none -%}
              {%- for mac, beacon in fp.beacons.items() -%}
                {%- if not beacon.get('ignored', false) -%}
                  {%- set mac_upper = mac | upper -%}
                  {%- if mac_upper not in global_ignored and mac_upper not in ns.macs -%}
                    {%- set ns.macs = ns.macs + [mac_upper] -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.macs | length }}
        attributes:
          mac_locs: >
            {%- set ns = namespace(mac_locs={}) -%}
            {%- set global_ignored = (state_attr('sensor.bt_ignored_beacons', 'ignored') or []) | map('upper') | list -%}
            {%- set fingerprints = state_attr('sensor.bt_fingerprint_database_file', 'fingerprints') or [] -%}
            {%- set locations_list = state_attr('sensor.bt_location_array', 'locations') or [] -%}
            {%- set rssi_tolerance = states('input_number.bt_rssi_tolerance') | int(5) -%}
            {%- set total_locations = locations_list | length -%}
            {# Pass 1: Build mac_locs with locs, rssi_list, and high_span per beacon #}
            {# high_span: true if any fingerprint entry for this MAC has max-min > 2*tolerance (unstable range) #}
            {%- for fp in fingerprints -%}
              {%- set loc_idx = fp.loc -%}
              {%- set loc_name = locations_list[loc_idx] if loc_idx >= 0 and loc_idx < locations_list | length else '' -%}
              {%- if loc_name and fp.beacons is not none -%}
                {%- for mac, beacon in fp.beacons.items() -%}
                  {%- if not beacon.get('ignored', false) -%}
                    {%- set mac_upper = mac | upper -%}
                    {%- set rssi_val = ((beacon.min + beacon.max) / 2) | int if 'min' in beacon else beacon.rssi -%}
                    {%- set span = (beacon.max - beacon.min) if 'min' in beacon else 0 -%}
                    {%- set is_high_span = span > 2 * rssi_tolerance -%}
                    {%- if mac_upper not in global_ignored -%}
                      {%- if mac_upper not in ns.mac_locs -%}
                        {%- set ns.mac_locs = ns.mac_locs | combine({mac_upper: {'locs': [], 'rssi_list': [], 'high_span': false}}) -%}
                      {%- endif -%}
                      {%- if loc_name not in ns.mac_locs[mac_upper].locs -%}
                        {%- set ns.mac_locs = ns.mac_locs | combine({mac_upper: {'locs': ns.mac_locs[mac_upper].locs + [loc_name], 'rssi_list': ns.mac_locs[mac_upper].rssi_list + [rssi_val], 'high_span': ns.mac_locs[mac_upper].high_span or is_high_span}}) -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
              {%- endif -%}
            {%- endfor -%}
            {# Pass 2: Compute discriminator strength, drop rssi_list from output #}
            {%- set ns2 = namespace(result={}) -%}
            {%- for mac, data in ns.mac_locs.items() -%}
              {%- set rssi_list = data.rssi_list -%}
              {%- set n = rssi_list | length -%}
              {%- if n <= 1 -%}
                {%- set discriminator = 0 -%}
              {%- else -%}
                {%- set ns_c = namespace(pairs_within=0, pairs_total=0) -%}
                {%- for i in range(n) -%}
                  {%- for j in range(i+1, n) -%}
                    {%- set ns_c.pairs_total = ns_c.pairs_total + 1 -%}
                    {%- if (rssi_list[i] - rssi_list[j]) | abs <= rssi_tolerance -%}
                      {%- set ns_c.pairs_within = ns_c.pairs_within + 1 -%}
                    {%- endif -%}
                  {%- endfor -%}
                {%- endfor -%}
                {%- if n == total_locations and ns_c.pairs_within == ns_c.pairs_total -%}
                  {%- set discriminator = -1 -%}
                {%- elif ns_c.pairs_within == 0 -%}
                  {%- set discriminator = 1 -%}
                {%- else -%}
                  {%- set discriminator = 0 -%}
                {%- endif -%}
              {%- endif -%}
              {%- set ns2.result = ns2.result | combine({mac: {'locs': data.locs, 'discriminator': discriminator, 'high_span': data.high_span}}) -%}
            {%- endfor -%}
            {{ ns2.result | to_json }}

      # BT Location Array - Parses input_text.bt_calibration_locations into indexable array
      # User edits comma-separated locations in input_text, this sensor stores as array in attributes
      # Access via: state_attr('sensor.bt_location_array', 'locations')[index]
      # State is count of locations, attributes contain the actual list
      - name: "BT Location Array"
        unique_id: bt_location_array
        icon: mdi:format-list-numbered
        state: >
          {%- set locations_text = states('input_text.bt_calibration_locations') -%}
          {%- if locations_text and locations_text != 'unavailable' -%}
            {{ locations_text.split(',')
               | map('trim')
               | reject('eq', '')
               | list
               | length }}
          {%- else -%}
            0
          {%- endif -%}
        attributes:
          locations: >
            {%- set locations_text = states('input_text.bt_calibration_locations') -%}
            {%- if locations_text and locations_text != 'unavailable' -%}
              {{ locations_text.split(',')
                 | map('trim')
                 | reject('eq', '')
                 | list }}
            {%- else -%}
              []
            {%- endif -%}

  # Webhook-triggered sensor for latest BT scan (replaces file-based storage)
  # Stores complete scan data in memory via attributes (16KB+ capacity, no disk I/O)
  # Triggered directly by Tasker webhook - data flows: webhook → template sensor attributes → dashboard
  - triggers:
      - trigger: webhook
        webhook_id: phone_charger_bt
        allowed_methods:
          - POST
          - PUT
        local_only: false
    sensor:
      - name: "BT Latest Scan Full"
        unique_id: bt_latest_scan_full
        state: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
        attributes:
          # Random MAC filtering applied at webhook time (bit 1 of first octet set = locally administered / privacy-mode device)
          # bt_include_random_macs OFF (default): random MACs excluded from all downstream processing (display, capture, detection)
          # bt_include_random_macs ON: all MACs included regardless of type
          devices: |
            {%- set raw = trigger.json.devices | default([]) -%}
            {%- if states('input_boolean.bt_include_random_macs') | bool(false) -%}
              {{ raw }}
            {%- else -%}
              {%- set ns = namespace(result=[]) -%}
              {%- for device in raw -%}
                {%- set first_octet = device.mac.split(':')[0] | int(base=16) -%}
                {%- set is_local = (first_octet | bitwise_and(2)) != 0 -%}
                {%- set is_static_random = (first_octet | bitwise_and(192)) == 192 -%}
                {%- if not is_local or is_static_random -%}
                  {%- set ns.result = ns.result + [device] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.result }}
            {%- endif -%}


          # Count beacons in current scan that exist in active known beacons list
          # Uses dynamically calculated list from sensor.bt_active_known_beacons (auto-updates on fingerprint/ignore changes)
          # Counts all captured devices including RSSI=0; filtering is applied at usage level by toggle
          known_beacons_in_scan: |
            {%- set ns = namespace(count=0) -%}
            {%- set mac_locs_raw = state_attr('sensor.bt_active_known_beacons', 'mac_locs') or '{}' -%}
            {%- set active_beacons = (mac_locs_raw | from_json if mac_locs_raw is string else mac_locs_raw).keys() | list -%}
            {%- set devices = state_attr('sensor.bt_latest_scan_full', 'devices') or [] -%}
            {%- for device in devices -%}
              {%- set mac = device.mac | upper -%}
              {%- if mac in active_beacons -%}
                {%- set ns.count = ns.count + 1 -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.count }}

          browser_id: "{{ trigger.json.browser_id | default('unknown') }}"
          timestamp: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

      # Webhook-triggered sensor for BT device names mapping
      # Accumulates MAC→name pairs from each scan, and survives a restart via HA's
      # restore-state store, so the map is cumulative across sessions
      # Triggered by same webhook as BT Latest Scan Full - data flows: webhook → template sensor attributes → dashboard
      - name: "BT Device Names"
        unique_id: bt_device_names
        state: "ready"
        attributes:
          devices_by_mac: |
            {%- set placeholders = ['', 'unknown', 'undefined'] -%}
            {# `or {}` rather than `| default({})`: an absent attribute reads as
               None, and default() only replaces undefined. #}
            {%- set current_map_raw = state_attr('sensor.bt_device_names', 'devices_by_mac') or {} -%}
            {%- set current_map = current_map_raw | from_json if current_map_raw is string else current_map_raw -%}
            {# Carry forward only real names. A placeholder held in the map is
               re-selected as the cached fallback below and rewritten on every
               scan, so it would otherwise never leave. #}
            {%- set ns = namespace(new_map={}) -%}
            {%- for cached_mac, cached_name in current_map.items() if cached_name not in placeholders -%}
              {%- set ns.new_map = ns.new_map | combine({cached_mac: cached_name}) -%}
            {%- endfor -%}
            {%- for device in trigger.json.devices or [] -%}
              {%- set mac = device.mac | upper -%}
              {%- set incoming = device.get('name') or '' -%}
              {%- set cached = ns.new_map.get(mac, '') -%}
              {%- set name = incoming if incoming not in placeholders else cached -%}
              {%- if name not in placeholders -%}
                {%- set ns.new_map = ns.new_map | combine({mac: name}) -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.new_map | to_json }}

  # Event-triggered sensor for BT location detection scores (transient, in-memory only)
  # Triggered by bt_location_scores_updated event fired from bt_detect_location_from_signals script
  # No file I/O - scores kept in memory only (real-time detection data via event bus)
  - triggers:
      - trigger: event
        event_type: bt_location_scores_updated
    sensor:
      - name: "BT Location Scores"
        unique_id: bt_location_scores
        state: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
        attributes:
          location_scores: "{{ trigger.event.data.scores }}"
          active_beacons_in_scan: "{{ trigger.event.data.active_beacons_in_scan | int(0) }}"
          known_beacons_in_scan: "{{ trigger.event.data.known_beacons_in_scan | int(0) }}"
          unknown_beacons_in_scan: "{{ trigger.event.data.unknown_beacons_in_scan | int(0) }}"

  # BT Location Confusion Matrix - Stores pre-calculated similarity scores
  # Updated by script.bt_generate_confusion_matrix when fingerprints/locations/tolerance change
  - triggers:
      - trigger: event
        event_type: bt_matrix_calculation_complete
    sensor:
      - name: "BT Location Confusion Matrix"
        unique_id: bt_location_confusion_matrix
        icon: mdi:matrix
        state: "{{ now().isoformat() }}"
        attributes:
          matrix: "{{ trigger.event.data.matrix }}"

# ------------------------------------------------------------------
# SCRIPTS
# ------------------------------------------------------------------
script:
  bt_generate_confusion_matrix:
    alias: "Generate BT Confusion Matrix"
    description: "Calculate location confusion scores using worst-case range overlap (no midpoint approximation)"
    mode: restart
    sequence:
      - variables:
          fingerprints_raw: "{{ state_attr('sensor.bt_fingerprint_database_file', 'fingerprints') or [] }}"
          locations_list: "{{ state_attr('sensor.bt_location_array', 'locations') or [] }}"
          rssi_tolerance: "{{ states('input_number.bt_rssi_tolerance') | int(5) }}"
          global_ignored_list: "{{ (state_attr('sensor.bt_ignored_beacons', 'ignored') or []) | map('upper') | list }}"

      # Build map: location_name → beacons dict
      - variables:
          fp_map: >
            {%- set ns = namespace(data={}) -%}
            {%- for fp in fingerprints_raw -%}
              {%- set loc_idx = fp.loc -%}
              {%- if loc_idx >= 0 and loc_idx < locations_list | length -%}
                {%- set loc_name = locations_list[loc_idx] -%}
                {%- set ns.data = ns.data | combine({loc_name: fp.beacons}) -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.data }}

      # Compute full matrix in one pass.
      # Score formula mirrors the detection algorithm: (matched/col_total) × (matched/row_active)
      # where row_active = scan_valid (all row beacons are known in matrix context).
      # Match condition: row beacon midpoint falls within col beacon range (point-in-range).
      # Midpoint for min/max beacon: (min+max)/2. Midpoint for mean beacon: rssi.
      # Col range for min/max beacon: [min, max]. Col range for mean beacon: [rssi-tol, rssi+tol].
      # This mirrors real detection: simulates a "typical" scan from the row location.
      - variables:
          matrix_rows: >
            {%- set tol = rssi_tolerance | int -%}
            {%- set ns = namespace(rows=[]) -%}
            {%- for row_loc in fp_map.keys() | sort -%}
              {%- set row_beacons = fp_map[row_loc] -%}
              {%- set ns_scores = namespace(scores={}) -%}

              {# Count active row beacons (scan_valid equivalent) #}
              {%- set ns_row = namespace(active=0) -%}
              {%- for mac, rb in row_beacons.items() -%}
                {%- if not rb.get('ignored', false) and mac | upper not in global_ignored_list -%}
                  {%- set ns_row.active = ns_row.active + 1 -%}
                {%- endif -%}
              {%- endfor -%}

              {%- set ns_overlaps = namespace(data={}) -%}
              {%- for col_loc in fp_map.keys() | sort -%}
                {%- set col_beacons = fp_map[col_loc] -%}
                {%- set ns_col = namespace(matched=0, total=0) -%}
                {%- set ns_ovl = namespace(beacons=[]) -%}

                {%- for mac, cb in col_beacons.items() -%}
                  {%- set mac_upper = mac | upper -%}
                  {%- if not cb.get('ignored', false) and mac_upper not in global_ignored_list -%}
                    {%- set ns_col.total = ns_col.total + 1 -%}
                    {%- if mac in row_beacons -%}
                      {%- set rb = row_beacons[mac] -%}
                      {%- if not rb.get('ignored', false) and mac_upper not in global_ignored_list -%}
                        {%- set r_lo = rb.min if 'min' in rb else rb.rssi - tol -%}
                        {%- set r_hi = rb.max if 'max' in rb else rb.rssi + tol -%}
                        {%- set r_mid = ((r_lo + r_hi) / 2) | int -%}
                        {%- set c_lo = cb.min if 'min' in cb else cb.rssi - tol -%}
                        {%- set c_hi = cb.max if 'max' in cb else cb.rssi + tol -%}
                        {%- if r_mid >= c_lo and r_mid <= c_hi -%}
                          {%- set ns_col.matched = ns_col.matched + 1 -%}
                          {%- if row_loc != col_loc -%}
                            {%- set ns_ovl.beacons = ns_ovl.beacons + [{'mac': mac_upper, 'r_lo': r_lo, 'r_hi': r_hi, 'c_lo': c_lo, 'c_hi': c_hi}] -%}
                          {%- endif -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}

                {%- if ns_col.total > 0 and ns_row.active > 0 -%}
                  {%- set score = ((ns_col.matched / ns_col.total) * (ns_col.matched / ns_row.active)) | round(2) -%}
                {%- else -%}
                  {%- set score = 0 -%}
                {%- endif -%}
                {%- set ns_scores.scores = ns_scores.scores | combine({col_loc: score}) -%}
                {%- if row_loc != col_loc and ns_ovl.beacons | length > 0 -%}
                  {%- set ns_overlaps.data = ns_overlaps.data | combine({col_loc: ns_ovl.beacons}) -%}
                {%- endif -%}
              {%- endfor -%}

              {%- set ns.rows = ns.rows + [{'src': row_loc, 'scores': ns_scores.scores, 'overlaps': ns_overlaps.data}] -%}
            {%- endfor -%}
            {{ ns.rows }}

      # Fire event with complete matrix
      - event: bt_matrix_calculation_complete
        event_data:
          matrix: "{{ matrix_rows | to_json }}"

      # Log completion
      - action: system_log.write
        data:
          message: "BT Confusion Matrix calculated: {{ matrix_rows | length }} locations"
          level: info

  bt_detect_charger_location:
    alias: "BT: Detect charger location"
    description: "Analyze BT signals from Tasker scan and detect phone charger location"
    mode: queued
    fields:
      browser_id:
        description: "Device browser_id (e.g., peers_mobil, kitchen_tablet)"
        example: "peers_mobil"
      devices:
        description: "Array of BT devices with MAC, name, and RSSI from Tasker scan"
        example: "[{'mac': 'AA:BB:CC:DD:EE:FF', 'name': 'Device Name', 'rssi': -65}]"
    sequence:
      # Call location-specific detection logic (user-customizable in screensaver_local.yaml)
      - action: script.bt_detect_location_from_signals
        data:
          devices: "{{ devices }}"
        response_variable: detection_result

      # Transform browser_id to device_id by stripping FKB suffix
      - variables:
          transform_pattern: "{{ state_attr('sensor.dashboard_logic_config', 'browser_id_transform_pattern') }}"
          # `from_json({})` is the whole guard: states() returns the string 'unknown' rather than an
          # undefined value, so a `default` filter here could never fire.
          current_mapping: "{{ states('input_text.bt_device_charger_locations') | from_json({}) }}"

      - variables:
          # ignorecase matches the dashboard, which applies the same pattern with the JS 'i' flag
          regex_matches: "{{ browser_id | regex_findall(transform_pattern, ignorecase=True) }}"

      - variables:
          device_id: "{{ regex_matches[0] if regex_matches | length > 0 else browser_id }}"

      - variables:
          detected_location: "{{ detection_result.detected_location }}"
          updated_mapping: "{{ current_mapping | combine({device_id: detected_location}) }}"

      - variables:
          updated_mapping_json: "{{ updated_mapping | to_json }}"

      # Update generic device-to-location JSON mapping
      - action: input_text.set_value
        target:
          entity_id: input_text.bt_device_charger_locations
        data:
          value: "{{ updated_mapping_json }}"

      # Log location detection result
      - action: system_log.write
        data:
          message: "Charger location detected: {{ detected_location }} (Score: {{ detection_result.score }}, Confidence: {{ \"%.1f\" | format(detection_result.confidence * 100) }}%)"
          level: info

# ------------------------------------------------------------------
# AUTOMATIONS
# ------------------------------------------------------------------
  bt_beacon_toggle_ignored:
    alias: "BT: Toggle beacon ignored"
    description: "Toggle a beacon's locally ignored flag at one location, or at every location when location_index is omitted."
    mode: queued
    max: 25
    fields:
      mac:
        description: "Beacon MAC address to toggle"
        example: "AA:BB:CC:DD:EE:FF"
      location_index:
        description: "Location index. Omit to toggle the beacon at every location."
        example: "0"
    sequence:
      - variables:
          locations_list: "{{ state_attr('sensor.bt_location_array', 'locations') or [] }}"
          scoped: "{{ location_index is defined }}"
          location_idx: "{{ location_index | default(-1) | int(-1) }}"
          beacon_mac: "{{ mac | upper }}"

      - variables:
          scope_name: "{{ locations_list[location_idx] if location_idx >= 0 and location_idx < locations_list | length else ('every location' if not scoped else 'unknown') }}"

      # An index that was supplied but cannot be used is a caller error, not a request to act
      # everywhere - treating it as "all locations" would silently widen the edit.
      - if: "{{ location_idx >= 0 or not scoped }}"
        then:
          - action: script.bt_write_fingerprints
            data:
              operation: toggle_ignored
              location_index: "{{ location_idx }}"
              mac: "{{ beacon_mac }}"
            response_variable: write_result

          # A refused write must not be reported as a success. The notification already explains it.
          - if: "{{ not (write_result.ok | default(true)) }}"
            then:
              - stop: "write refused"

          - action: system_log.write
            data:
              message: >-
                {{ 'Toggled beacon ' ~ beacon_mac ~ ' locally ignored at ' ~ scope_name
                   if write_result.changed | default(true)
                   else 'Beacon ' ~ beacon_mac ~ ' is not in the fingerprint at ' ~ scope_name ~ ' - nothing changed' }}
              level: debug
        else:
          # Doing nothing quietly is what makes a caller mistake hard to find. The writer logs the
          # same class of error for itself.
          - action: system_log.write
            data:
              message: "BT: toggle_ignored got an unusable location_index ({{ location_index }}) for beacon {{ beacon_mac }} - nothing changed"
              level: error

  bt_beacon_remove_from_fingerprints:
    alias: "BT: Remove beacon from fingerprints"
    description: "Remove a beacon from one location's fingerprint, or from every location when location_index is omitted."
    mode: queued
    max: 25
    fields:
      mac:
        description: "Beacon MAC address to remove"
        example: "AA:BB:CC:DD:EE:FF"
      location_index:
        description: "Location index. Omit to remove the beacon from every location."
        example: "0"
    sequence:
      - variables:
          locations_list: "{{ state_attr('sensor.bt_location_array', 'locations') or [] }}"
          scoped: "{{ location_index is defined }}"
          location_idx: "{{ location_index | default(-1) | int(-1) }}"
          beacon_mac: "{{ mac | upper }}"

      - variables:
          scope_name: "{{ locations_list[location_idx] if location_idx >= 0 and location_idx < locations_list | length else ('every location' if not scoped else 'unknown') }}"

      # Same guard as the toggle: a supplied-but-unusable index must not escalate to all locations.
      - if: "{{ location_idx >= 0 or not scoped }}"
        then:
          - action: script.bt_write_fingerprints
            data:
              operation: remove_beacon
              location_index: "{{ location_idx }}"
              mac: "{{ beacon_mac }}"
            response_variable: write_result

          - if: "{{ not (write_result.ok | default(true)) }}"
            then:
              - stop: "write refused"

          - action: system_log.write
            data:
              message: >-
                {{ 'Removed beacon ' ~ beacon_mac ~ ' from the fingerprint at ' ~ scope_name
                   if write_result.changed | default(true)
                   else 'Beacon ' ~ beacon_mac ~ ' was not in the fingerprint at ' ~ scope_name ~ ' - nothing changed' }}
              level: debug
        else:
          # Same as the toggle: a supplied index that cannot be used is a caller error worth naming.
          - action: system_log.write
            data:
              message: "BT: remove_from_fingerprints got an unusable location_index ({{ location_index }}) for beacon {{ beacon_mac }} - nothing changed"
              level: error

  bt_beacon_toggle_global_ignored:
    alias: "BT: Toggle beacon globally ignored"
    mode: queued
    max: 25
    description: "Toggle beacon in global ignored list (hold/double-tap action)"
    fields:
      mac:
        description: "Beacon MAC address to toggle globally"
        example: "AA:BB:CC:DD:EE:FF"
    sequence:
      - variables:
          beacon_mac: "{{ mac | upper }}"
          # Read current ignored list from sensor attribute (file-backed)
          current_list_raw: "{{ state_attr('sensor.bt_ignored_beacons', 'ignored') }}"
          current_list: "{{ current_list_raw or [] }}"

      # This script rebuilds the whole ignore list from the sensor, so an unreadable sensor would write
      # a list holding only this one MAC over however many the file really has. The persistor's count
      # guard covers fingerprints only - an ignore list empties legitimately when the last beacon is
      # restored - so the check belongs here, at the one script that writes this file.
      # `is none` is the unreadable case; a genuinely empty list reads as [] and is written normally.
      - if: "{{ current_list_raw is none }}"
        then:
          - action: system_log.write
            data:
              message: "BT: sensor.bt_ignored_beacons has no 'ignored' attribute - global ignore of {{ beacon_mac }} not attempted, the list on disk is left alone"
              level: error
          - stop: "ignore list unreadable"

      # Check if MAC is already in the list
      - variables:
          is_ignored: "{{ beacon_mac in current_list }}"

      - variables:
          updated_list:
            ignored: "{{ current_list | reject('equalto', beacon_mac) | list if is_ignored else current_list + [beacon_mac] }}"

      # Write updated list to file
      - action: script.bt_persist_write
        data:
          data_type: ignored
          json_content: "{{ updated_list }}"
          # Restoring a beacon removes it from the list, which is the one routine shrink the persistor
          # cannot tell apart from a rebuild off a sensor that could not read the file.
          allow_shrink: "{{ is_ignored }}"
        response_variable: write_result

      # Stop before the log and before touching fingerprints: if the ignore list did not change,
      # stripping the beacon from every fingerprint would leave the two files disagreeing.
      - if: "{{ not (write_result.ok | default(true)) }}"
        then:
          - stop: "write refused"

      # Log the action
      - action: system_log.write
        data:
          message: "{{ 'Removed' if is_ignored else 'Added' }} beacon {{ beacon_mac }} to global ignored list"
          level: debug

      # When adding to global ignore, also remove from all fingerprints
      - if: "{{ not is_ignored }}"
        then:
          - action: script.bt_write_fingerprints
            data:
              operation: remove_beacon
              mac: "{{ beacon_mac }}"
            response_variable: write_result

          # Being the last step, this cannot report a false success - but a refusal here leaves the two
          # files disagreeing: the beacon is on the ignore list, which succeeded, and still in the
          # fingerprints, which did not. The ignore list write cannot be rolled back, so say plainly
          # what is inconsistent and what repairs it.
          - if: "{{ not (write_result.ok | default(true)) }}"
            then:
              - action: system_log.write
                data:
                  message: >-
                    BT: {{ beacon_mac }} was added to the global ignore list but could not be removed
                    from the fingerprints - the two files now disagree. Repair bt_fingerprints.json,
                    then hold the beacon twice to re-run the removal.
                  level: error

  bt_calculate_location_scores:
    alias: "BT: Calculate location scores"
    description: "Calculate location scores against latest BT scan and update location metrics"
    sequence:
      # Load latest scan from sensor
      - variables:
          scan_devices: "{{ state_attr('sensor.bt_latest_scan_full', 'devices') or [] }}"

      # Call location detection with loaded scan data
      - action: script.bt_detect_location_from_signals
        data:
          devices: "{{ scan_devices }}"

  bt_detect_location_from_signals:
    alias: "BT: Detect location from signals"
    description: "Apply location detection rules to BT signal data (user-customizable)"
    fields:
      devices:
        description: "Array of BT devices with MAC, name, and RSSI from Tasker scan"
        example: "[{'mac': 'AA:BB:CC:DD:EE:FF', 'name': 'Device Name', 'rssi': -65}]"
      persist_scores:
        description: "Whether to update dashboard sensor with location scores (default: true)"
        example: "true"
      scan_context:
        description: "Context for logging (e.g., 'Latest scan' or 'Fingerprint #2 (KÖK)') (default: 'Latest scan')"
        example: "Latest scan"
    variables:
      # Control whether to update dashboard sensor with location scores
      persist_scores: "{{ persist_scores | default(true) }}"
      # Context for logging (latest scan or fingerprint number)
      scan_context: "{{ scan_context | default('Latest scan') }}"
      # `default(none)` deliberately, not `or []`: none is the wanted value when the sensor has no
      # locations, and the consumer below tests `if locations_map` before indexing, falling back to the
      # numeric index for a name. Leave this one alone when sweeping for inert `| default(...)` guards.
      locations_map: "{{ state_attr('sensor.bt_location_array', 'locations') | default(none) }}"
      raw_fingerprints: "{{ state_attr('sensor.bt_fingerprint_database_file', 'fingerprints') or [] }}"
      fingerprints_parsed: |
        {%- set ns = namespace(data=[]) -%}
        {%- for fp in raw_fingerprints -%}
          {%- set location_idx = fp.loc -%}
          {%- if location_idx >= 0 -%}
            {%- if locations_map and location_idx < locations_map | length -%}
              {%- set location_name = locations_map[location_idx] -%}
            {%- else -%}
              {%- set location_name = location_idx | string -%}
            {%- endif -%}
            {%- set ns.data = ns.data + [{"location": location_name, "location_idx": location_idx, "beacons": fp.beacons}] -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.data }}

    sequence:
      # Call location detection algorithm (Symmetric Ratio)
      - action: script.bt_location_symmetric_ratio
        data:
          devices: "{{ devices }}"
          fingerprints_parsed: "{{ fingerprints_parsed }}"
          scan_context: "{{ scan_context }}"
        response_variable: algorithm_result

      # Build result with all scoring details and beacon counts
      - variables:
          result:
            detected_location: "{{ algorithm_result.detected_location }}"
            confidence: "{{ algorithm_result.confidence }}"
            score: "{{ algorithm_result.score }}"
            scores_detail: "{{ algorithm_result.scores_detail }}"
            active_beacons_in_scan: "{{ algorithm_result.active_beacons_in_scan }}"
            known_beacons_in_scan: "{{ algorithm_result.known_beacons_in_scan }}"
            unknown_beacons_in_scan: "{{ algorithm_result.unknown_beacons_in_scan }}"
            algorithm: "match_ratio"

      # Fire event to update in-memory sensor with scores and beacon counts (no disk I/O)
      - if: "{{ persist_scores }}"
        then:
          - event: bt_location_scores_updated
            event_data:
              scores: "{{ result.scores_detail }}"
              active_beacons_in_scan: "{{ result.active_beacons_in_scan }}"
              known_beacons_in_scan: "{{ result.known_beacons_in_scan }}"
              unknown_beacons_in_scan: "{{ result.unknown_beacons_in_scan }}"

      - stop: "Location detected"
        response_variable: result

  bt_capture_fingerprint:
    alias: "BT: Capture fingerprint"
    mode: queued
    max: 25
    description: "Capture current RSSI values as fingerprint for location"
    fields:
      location_index:
        description: "Location index (0-based, required)"
        example: "0"
      browser_id:
        description: "Browser ID for toast notification (optional)"
        example: "peers_mobil"
    sequence:
      - variables:
          # Get all detected beacons from latest scan (full device list from file sensor)
          raw_scan: "{{ state_attr('sensor.bt_latest_scan_full', 'devices') or [] }}"
          # Get weak signal threshold, global ignored list, and ghost signal toggle
          weak_signal_threshold: "{{ states('input_number.bt_weak_signal_threshold') | int(-95) }}"
          global_ignored_raw: "{{ state_attr('sensor.bt_ignored_beacons', 'ignored') or [] }}"
          global_ignored_list: "{{ global_ignored_raw | map('upper') | list if global_ignored_raw is iterable else [] }}"
          filter_zero_rssi: "{{ states('input_boolean.bt_filter_zero_rssi_signals') | bool(false) }}"
          minmax_mode: "{{ states('input_boolean.bt_fingerprint_minmax_mode') | bool(false) }}"
          # Seeds the width of a new min/max entry, matching what the two reset paths use.
          rssi_tolerance: "{{ states('input_number.bt_rssi_tolerance') | int(5) }}"
          location: "{{ state_attr('sensor.bt_location_array', 'locations')[location_index | int] | default('unknown') }}"

      - variables:
          # Filter scan: exclude weak signals, globally ignored beacons, and ghost beacons (if toggle is ON)
          scan: |
            {%- set ns = namespace(filtered=[]) -%}
            {%- for device in raw_scan -%}
              {%- set mac_upper = device.mac | upper -%}
              {%- set is_globally_ignored = mac_upper in global_ignored_list -%}
              {%- set is_weak = device.rssi < weak_signal_threshold -%}
              {%- set is_ghost = filter_zero_rssi and device.rssi == 0 -%}
              {%- if not is_globally_ignored and not is_weak and not is_ghost -%}
                {%- set ns.filtered = ns.filtered + [device] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.filtered }}

      # Validate that at least one anchor device was detected
      - if:
          - condition: template
            value_template: "{{ scan | length > 0 }}"
        then:
          - variables:
              # Build device details with names for display (MAC=RSSI (Device Name))
              device_details: |
                {%- set ns = namespace(pairs=[]) -%}
                {%- for device in scan -%}
                  {%- set ns.pairs = ns.pairs + [device.mac ~ '=' ~ device.rssi ~ ' (' ~ (device.name | default('unknown')) ~ ')'] -%}
                {%- endfor -%}
                {{ ns.pairs | join('\n') }}
          # A capture replaces the location outright from the scan, so nothing is read from the
          # existing database here.
          - variables:
              captured_beacons: |
                {%- set ns = namespace(beacons={}) -%}
                {%- for device in scan -%}
                  {%- if minmax_mode -%}
                    {# Seeded ±tolerance rather than collapsed to a point: min/max matching is strict,
                       so a point matches only on exact RSSI equality and a freshly captured location
                       would find nothing until several merges had widened it. The same width the
                       beacon and location reset paths use. Merges narrow or widen it from here. #}
                    {%- set ns.beacons = ns.beacons | combine({device.mac | upper: {'min': device.rssi - rssi_tolerance, 'max': device.rssi + rssi_tolerance}}) -%}
                  {%- else -%}
                    {%- set ns.beacons = ns.beacons | combine({device.mac | upper: {'rssi': device.rssi}}) -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.beacons }}

          - action: script.bt_write_fingerprints
            data:
              operation: replace_location
              location_index: "{{ location_index }}"
              beacons: "{{ captured_beacons }}"
            response_variable: write_result

          # Stop before the toast and before recording statistics: readings logged against a
          # fingerprint that was never written would describe a capture that did not happen.
          - if: "{{ not (write_result.ok | default(true)) }}"
            then:
              - stop: "write refused"

          - if:
              - condition: template
                value_template: "{{ browser_id is defined and browser_id != '' }}"
            then:
              - action: browser_mod.notification
                continue_on_error: true
                data:
                  browser_id: "{{ browser_id }}"
                  message: "Captured {{ scan | length }} beacons @{{ location }}"
                  duration: 5000

          - action: system_log.write
            data:
              message: "Location: {{ location }}\nBeacons: {{ scan | length }}\nDevices:\n{{ device_details | trim }}"
              level: info

          - action: script.bt_record_merge_statistics
            data:
              location_index: "{{ location_index }}"
        else:
          - if:
              - condition: template
                value_template: "{{ browser_id is defined and browser_id != '' }}"
            then:
              - action: browser_mod.notification
                continue_on_error: true
                data:
                  browser_id: "{{ browser_id }}"
                  message: "No scan data — place phone on charger and wait for scan"
                  duration: 5000

          - action: system_log.write
            data:
              message: "No BT devices detected. Place phone on charger and wait for Tasker scan, then try again."
              level: warning

  bt_merge_fingerprint:
    alias: "BT: Merge fingerprint"
    mode: queued
    max: 25
    description: "Merge or update the fingerprint for a location from the latest BT scan"
    fields:
      location_index:
        description: "Location index (0-based, required)"
        example: "0"
      rssi_only:
        description: "If true, only update RSSI for existing beacons (no new beacons added). Default: false (merge mode)"
        example: "false"
      browser_id:
        description: "Browser ID for toast notification (optional)"
        example: "peers_mobil"
    sequence:
      - variables:
          raw_scan: "{{ state_attr('sensor.bt_latest_scan_full', 'devices') or [] }}"
          # Get weak signal threshold, global ignored list, and ghost signal toggle
          weak_signal_threshold: "{{ states('input_number.bt_weak_signal_threshold') | int(-95) }}"
          global_ignored_raw: "{{ state_attr('sensor.bt_ignored_beacons', 'ignored') or [] }}"
          global_ignored_list: "{{ global_ignored_raw | map('upper') | list if global_ignored_raw is iterable else [] }}"
          filter_zero_rssi: "{{ states('input_boolean.bt_filter_zero_rssi_signals') | bool(false) }}"
          rssi_only: "{{ rssi_only | default(false) | bool }}"
          minmax_mode: "{{ states('input_boolean.bt_fingerprint_minmax_mode') | bool(false) }}"
          # Seeds the width of an entry that has no range yet, matching capture and the reset paths.
          rssi_tolerance: "{{ states('input_number.bt_rssi_tolerance') | int(5) }}"

      - variables:
          # Filter scan: exclude weak signals, globally ignored beacons, and ghost beacons (if toggle is ON)
          scan: |
            {%- set ns = namespace(filtered=[]) -%}
            {%- for device in raw_scan -%}
              {%- set mac_upper = device.mac | upper -%}
              {%- set is_globally_ignored = mac_upper in global_ignored_list -%}
              {%- set is_weak = device.rssi < weak_signal_threshold -%}
              {%- set is_ghost = filter_zero_rssi and device.rssi == 0 -%}
              {%- if not is_globally_ignored and not is_weak and not is_ghost -%}
                {%- set ns.filtered = ns.filtered + [device] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.filtered }}

      - if:
          - condition: template
            value_template: "{{ scan | length > 0 }}"
        then:
          - variables:
              # Build scan data map: MAC -> RSSI for quick lookup
              scan_map: |
                {%- set ns = namespace(map={}) -%}
                {%- for device in scan -%}
                  {%- set ns.map = ns.map | combine({device.mac | upper: device.rssi}) -%}
                {%- endfor -%}
                {{ ns.map }}
              # Read current fingerprints
              current_fingerprints: "{{ state_attr('sensor.bt_fingerprint_database_file', 'fingerprints') or [] }}"

          - variables:
              # Extract existing beacons dict for this location
              existing_beacons: |
                {%- set ns = namespace(beacons={}) -%}
                {%- for fp in current_fingerprints -%}
                  {%- if fp.loc | int == location_index | int -%}
                    {%- for mac, beacon in fp.beacons.items() -%}
                      {%- set ns.beacons = ns.beacons | combine({mac: beacon}) -%}
                    {%- endfor -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.beacons }}

          - variables:
              # Merge/update: mode-driven — all entries written in current mode format
              # rssi_only=true: existing beacons only (no new beacons added)
              # rssi_only=false (default): also adds new beacons from scan
              merged_beacons: |
                {%- set ns = namespace(merged=existing_beacons) -%}
                {%- for scan_mac, scan_rssi in scan_map.items() -%}
                  {%- if scan_mac in ns.merged or not rssi_only -%}
                    {%- set existing_beacon = ns.merged.get(scan_mac, {}) -%}
                    {%- set was_ignored = existing_beacon.get('ignored', false) -%}
                    {%- if minmax_mode -%}
                      {# Min/max mode: all entries written as min/max #}
                      {%- if 'min' in existing_beacon -%}
                        {# Already a range: widen it only if this scan falls outside. #}
                        {%- set new_min = [existing_beacon.min, scan_rssi] | min -%}
                        {%- set new_max = [existing_beacon.max, scan_rssi] | max -%}
                      {%- else -%}
                        {# No range yet — a beacon new to this location, or a mean entry being
                           converted. Seeded ±tolerance rather than collapsed to a point: min/max
                           matching is strict, so a point matches only on exact RSSI equality and
                           the beacon would sit in the fingerprint contributing nothing until a
                           later scan happened to differ. Same width as capture and the resets. #}
                        {%- set new_min = scan_rssi - rssi_tolerance -%}
                        {%- set new_max = scan_rssi + rssi_tolerance -%}
                      {%- endif -%}
                      {%- set beacon_data = {'min': new_min, 'max': new_max} -%}
                    {%- else -%}
                      {# Mean mode: all entries written as mean RSSI #}
                      {%- if rssi_only and 'min' not in existing_beacon and scan_mac in ns.merged -%}
                        {# tap on existing mean entry: running mean (gentle incremental update) #}
                        {%- set avg_rssi = ((existing_beacon.rssi + scan_rssi) / 2) | round | int -%}
                        {%- set beacon_data = {'rssi': avg_rssi} -%}
                      {%- else -%}
                        {# full merge, new beacon, or conversion from min/max: use scan value #}
                        {%- set beacon_data = {'rssi': scan_rssi} -%}
                      {%- endif -%}
                    {%- endif -%}
                    {%- if was_ignored -%}
                      {%- set ns.merged = ns.merged | combine({scan_mac: beacon_data | combine({'ignored': true})}) -%}
                    {%- else -%}
                      {%- set ns.merged = ns.merged | combine({scan_mac: beacon_data}) -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.merged }}

          # `merged_beacons` already carries `ignored` per entry, and replace_location takes the dict
          # verbatim.
          - action: script.bt_write_fingerprints
            data:
              operation: replace_location
              location_index: "{{ location_index }}"
              beacons: "{{ merged_beacons }}"
            response_variable: write_result

          # Stop before the toast and before recording statistics, as capture does.
          - if: "{{ not (write_result.ok | default(true)) }}"
            then:
              - stop: "write refused"

          - variables:
              locations_list: "{{ state_attr('sensor.bt_location_array', 'locations') or [] }}"
              location_name: "{{ locations_list[location_index] if location_index >= 0 and location_index < locations_list | length else 'unknown' }}"

          - variables:
              refreshed_count: "{{ scan_map.keys() | select('in', existing_beacons) | list | length }}"
              changed_beacons: |
                {%- set ns = namespace(changes=[]) -%}
                {%- for mac, new_b in merged_beacons.items() -%}
                  {%- set old_b = existing_beacons.get(mac, {}) -%}
                  {%- if old_b -%}
                    {%- if 'min' in new_b -%}
                      {%- if new_b.min != old_b.get('min', new_b.min) or new_b.max != old_b.get('max', new_b.max) -%}
                        {%- set ns.changes = ns.changes + [mac ~ ': [' ~ old_b.get('min') ~ '/' ~ old_b.get('max') ~ '] → [' ~ new_b.min ~ '/' ~ new_b.max ~ ']'] -%}
                      {%- endif -%}
                    {%- else -%}
                      {%- if new_b.rssi != old_b.get('rssi', new_b.rssi) -%}
                        {%- set ns.changes = ns.changes + [mac ~ ': ' ~ old_b.get('rssi') ~ ' → ' ~ new_b.rssi] -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.changes | join('\n') if ns.changes else 'no changes' }}

          - if:
              - condition: template
                value_template: "{{ browser_id is defined and browser_id != '' }}"
            then:
              - action: browser_mod.notification
                continue_on_error: true
                data:
                  browser_id: "{{ browser_id }}"
                  message: "{{ 'Updated RSSI' if rssi_only else 'Merged' }} {% if rssi_only %}{{ refreshed_count }}/{{ merged_beacons | length }} beacons @{{ location_name }}{% else %}{{ merged_beacons | length }} beacons @{{ location_name }} (+{{ (merged_beacons | length) - (existing_beacons | length) }} new){% endif %}"
                  duration: 5000

          - action: system_log.write
            data:
              message: "Location: {{ location_name }}\n{% if rssi_only %}Beacons: {{ refreshed_count }} refreshed / {{ merged_beacons | length }} total\n{{ changed_beacons }}{% else %}Beacons added: {{ (merged_beacons | length) - (existing_beacons | length) }} new\nBeacons existing: {{ existing_beacons | length }}\nTotal: {{ merged_beacons | length }} beacons\n{{ changed_beacons }}{% endif %}"
              level: info

          - action: script.bt_record_merge_statistics
            data:
              location_index: "{{ location_index }}"
        else:
          - if:
              - condition: template
                value_template: "{{ browser_id is defined and browser_id != '' }}"
            then:
              - action: browser_mod.notification
                continue_on_error: true
                data:
                  browser_id: "{{ browser_id }}"
                  message: "No scan data — place phone on charger and wait for scan"
                  duration: 5000

  bt_beacon_reset_minmax:
    alias: "BT: Reset beacon min/max"
    mode: queued
    max: 25
    description: "Reset a single beacon entry from current scan: mean mode writes scan RSSI; min/max mode writes [scan−tol, scan+tol]. No-op if beacon absent from scan."
    fields:
      location_index:
        description: "Location index (0-based, required)"
        example: "0"
      mac:
        description: "Beacon MAC address (uppercase)"
        example: "DE:E3:0B:7D:6B:0B"
      browser_id:
        description: "Browser ID for toast notification (optional)"
        example: "peers_mobil"
    sequence:
      - variables:
          minmax_mode: "{{ states('input_boolean.bt_fingerprint_minmax_mode') | bool(false) }}"
          mac_upper: "{{ mac | upper }}"
          tolerance: "{{ states('input_number.bt_rssi_tolerance') | int(5) }}"
          scan_devices: "{{ state_attr('sensor.bt_latest_scan_full', 'devices') or [] }}"
          current_fingerprints_raw: "{{ state_attr('sensor.bt_fingerprint_database_file', 'fingerprints') }}"
          current_fingerprints: "{{ current_fingerprints_raw or [] }}"

      - variables:
          scan_rssi: |
            {%- set ns = namespace(rssi=none) -%}
            {%- for device in scan_devices -%}
              {%- if device.mac | upper == mac_upper -%}
                {%- set ns.rssi = device.rssi -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.rssi }}
          in_fingerprint: |
            {%- set ns = namespace(found=false) -%}
            {%- for fp in current_fingerprints if fp.loc | int == location_index | int -%}
              {%- for m in (fp.beacons or {}) if m | upper == mac_upper -%}
                {%- set ns.found = true -%}
              {%- endfor -%}
            {%- endfor -%}
            {{ ns.found }}

      # An unreadable database is not an absent beacon, and the remedies differ. Without this the guard
      # below reports "not in the fingerprint" at debug level, which is both wrong and quiet, and the
      # writer's own unreadable-database error is never reached because no write is attempted.
      - if: "{{ current_fingerprints_raw is none }}"
        then:
          - action: system_log.write
            data:
              message: "BT: sensor.bt_fingerprint_database_file has no 'fingerprints' attribute - reset of {{ mac_upper }} not attempted, the database on disk is left alone"
              level: error
          - stop: "fingerprint database unreadable"

      # Two ways there is nothing to reset, and both would otherwise reach the toast and log below,
      # which say the beacon was reset. `set_beacon` only replaces an entry that is already there, so
      # a beacon missing from this location's fingerprint is a silent no-op rather than an addition.
      - if: "{{ scan_rssi is none or not in_fingerprint | bool }}"
        then:
          - action: system_log.write
            data:
              message: >-
                Beacon {{ mac_upper }} is not in
                {{ 'the latest scan' if scan_rssi is none else 'the fingerprint at location ' ~ location_index }}
                - nothing to reset
              level: debug
          - stop: "nothing to reset"

      # The writer carries any existing `ignored` flag across.
      - action: script.bt_write_fingerprints
        data:
          operation: set_beacon
          location_index: "{{ location_index }}"
          mac: "{{ mac_upper }}"
          beacon: >-
            {{ {'min': scan_rssi | int - tolerance, 'max': scan_rssi | int + tolerance}
               if minmax_mode else {'rssi': scan_rssi | int} }}
        response_variable: write_result

      - if: "{{ not (write_result.ok | default(true)) }}"
        then:
          - stop: "write refused"

      - variables:
          locations_list: "{{ state_attr('sensor.bt_location_array', 'locations') or [] }}"
          location_name: "{{ locations_list[location_index | int] if location_index | int >= 0 and location_index | int < locations_list | length else 'unknown' }}"

      - if:
          - condition: template
            value_template: "{{ browser_id is defined and browser_id != '' }}"
        then:
          - action: browser_mod.notification
            data:
              browser_id: "{{ browser_id }}"
              message: "Reset {{ mac_upper }} @ {{ location_name }} ({{ 'Min/Max [scan ± ' + tolerance | string + ']' if minmax_mode else 'Mean' }})"
              duration: 5000

      - action: system_log.write
        data:
          message: "Location: {{ location_name }}\nBeacon: {{ mac_upper }}\nMode: {{ 'Min/Max [scan ± ' + tolerance | string + ']' if minmax_mode else 'Mean (scan RSSI)' }}"
          level: info

  bt_beacon_range_editor_open:
    alias: "BT: Open beacon range editor popup"
    description: "Pre-fill range editor helpers and open browser_mod popup for direct min/max editing of a fingerprint beacon"
    mode: restart
    fields:
      browser_id:
        description: "ID of the calling browser (targets popup to that browser only)"
        default: ""
      location_index:
        description: "Location index (0-based)"
        example: "0"
      mac:
        description: "Beacon MAC address (uppercase)"
        example: "8C:BF:EA:A1:3A:66"
      current_min:
        description: "Current fingerprint min value"
        example: "-70"
      current_max:
        description: "Current fingerprint max value"
        example: "-50"
      beacon_name:
        description: "Human-readable beacon name (for popup title)"
        default: ""
      tolerance:
        description: "Current RSSI tolerance setting"
        example: "10"
    sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.bt_range_editor_min
        data:
          value: "{{ current_min | int }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.bt_range_editor_max
        data:
          value: "{{ current_max | int }}"
      - variables:
          stats_p10_p90: |
            {%- set all_stats = state_attr('sensor.bt_merge_statistics', 'statistics') or [] -%}
            {%- set ns_s = namespace(beacons={}) -%}
            {%- for entry in all_stats -%}
              {%- if entry.loc | int == location_index | int -%}
                {%- set ns_s.beacons = entry.beacons -%}
              {%- endif -%}
            {%- endfor -%}
            {%- set readings = ns_s.beacons.get(mac | upper, []) -%}
            {%- set s_count = readings | length -%}
            {%- if s_count >= 10 -%}
              {%- set rssi_vals = readings | map(attribute=0) | reject('none') | list | sort -%}
              {%- set p10 = rssi_vals[(s_count * 0.1) | int] -%}
              {%- set p90 = rssi_vals[(s_count * 0.9) | int] -%}
              {{ p10 | string ~ '|' ~ p90 | string ~ '|' ~ s_count | string }}
            {%- else -%}
              {{ '||' ~ s_count | string }}
            {%- endif -%}
      - action: input_text.set_value
        target:
          entity_id: input_text.bt_range_editor_context
        data:
          value: "{{ location_index }}|{{ mac | upper }}|{{ tolerance }}|{{ current_min }}|{{ current_max }}|{{ stats_p10_p90 | trim }}"
      - action: browser_mod.popup
        data:
          browser_id: "{{ browser_id }}"
          title: "Edit range: {{ beacon_name if beacon_name else mac | upper }}"
          content:
            type: entities
            entities:
              - entity: input_number.bt_range_editor_min
                name: Min (dBm)
              - entity: input_number.bt_range_editor_max
                name: Max (dBm)
              - type: custom:button-card
                entity: input_text.bt_range_editor_context
                show_icon: false
                show_state: false
                name: |
                  [[[
                    const ctx = states['input_text.bt_range_editor_context']?.state?.split('|') || [];
                    const tol = parseInt(ctx[2]);
                    const cMin = parseFloat(ctx[3]);
                    const cMax = parseFloat(ctx[4]);
                    if (isNaN(cMin) || isNaN(cMax)) return 'Apply midpoint ± tolerance';
                    const mid = Math.round((cMin + cMax) / 2);
                    return `Apply midpoint ${mid} dBm:  ${mid - tol} / ${mid + tol}`;
                  ]]]
                tap_action:
                  action: perform-action
                  perform_action: script.bt_beacon_range_editor_apply_suggested
                styles:
                  card:
                    - background-color: var(--primary-color)
                    - color: var(--text-primary-color)
                    - border-radius: 6px
                    - height: 40px
                    - font-size: 13px
                    - opacity: |
                        [[[
                          const ctx = states['input_text.bt_range_editor_context']?.state?.split('|') || [];
                          const tol = parseInt(ctx[2]);
                          const mid = Math.round((parseFloat(ctx[3]) + parseFloat(ctx[4])) / 2);
                          const curMin = parseInt(states['input_number.bt_range_editor_min']?.state);
                          const curMax = parseInt(states['input_number.bt_range_editor_max']?.state);
                          return (curMin === mid - tol && curMax === mid + tol) ? '0.3' : '1';
                        ]]]
              - type: custom:button-card
                entity: input_text.bt_range_editor_context
                show_icon: false
                show_state: false
                name: |
                  [[[
                    const ctx = states['input_text.bt_range_editor_context']?.state?.split('|') || [];
                    const p10 = parseFloat(ctx[5]);
                    const p90 = parseFloat(ctx[6]);
                    const n = parseInt(ctx[7]) || 0;
                    if (isNaN(p10) || isNaN(p90)) return `Apply P10/P90  (n=${n}, need ≥10)`;
                    return `Apply P10/P90:  ${p10} / ${p90}  (n=${n})`;
                  ]]]
                tap_action:
                  action: perform-action
                  perform_action: script.bt_beacon_range_editor_apply_percentile
                styles:
                  card:
                    - background-color: var(--primary-color)
                    - color: var(--text-primary-color)
                    - border-radius: 6px
                    - height: 40px
                    - font-size: 13px
                    - opacity: |
                        [[[
                          const ctx = states['input_text.bt_range_editor_context']?.state?.split('|') || [];
                          const p10 = parseFloat(ctx[5]);
                          const p90 = parseFloat(ctx[6]);
                          const curMin = parseInt(states['input_number.bt_range_editor_min']?.state);
                          const curMax = parseInt(states['input_number.bt_range_editor_max']?.state);
                          if (isNaN(p10) || isNaN(p90)) return '0.3';
                          return (curMin === p10 && curMax === p90) ? '0.3' : '1';
                        ]]]
              - type: custom:button-card
                name: Save
                show_icon: false
                tap_action:
                  action: perform-action
                  perform_action: script.bt_beacon_range_editor_save
                  data:
                    browser_id: '[[[ return window.browser_mod?.browserID || ""; ]]]'
                styles:
                  card:
                    - background-color: var(--primary-color)
                    - color: var(--text-primary-color)
                    - border-radius: 6px
                    - height: 40px
                    - opacity: |
                        [[[
                          const ctx = states['input_text.bt_range_editor_context']?.state?.split('|') || [];
                          const fpMin = parseFloat(ctx[3]);
                          const fpMax = parseFloat(ctx[4]);
                          const curMin = parseInt(states['input_number.bt_range_editor_min']?.state);
                          const curMax = parseInt(states['input_number.bt_range_editor_max']?.state);
                          return (curMin === fpMin && curMax === fpMax) ? '0.3' : '1';
                        ]]]

  bt_beacon_range_editor_apply_suggested:
    alias: "BT: Apply suggested range to editor"
    description: "Sets range editor helpers to midpoint of current fingerprint range ± tolerance"
    mode: single
    sequence:
      - variables:
          # Stands in for a malformed context string. Reads the live helper rather than a literal,
          # so a suggested range is the same width as every other seeding path.
          tolerance_default: "{{ states('input_number.bt_rssi_tolerance') | int(5) }}"

      - variables:
          ctx: "{{ states('input_text.bt_range_editor_context').split('|') }}"
          tolerance_val: "{{ ctx[2] | int(tolerance_default) if ctx | length > 2 else tolerance_default }}"
          fp_min: "{{ ctx[3] | float(0) if ctx | length > 3 else 0 }}"
          fp_max: "{{ ctx[4] | float(0) if ctx | length > 4 else 0 }}"
          mid: "{{ ((fp_min + fp_max) / 2) | round | int }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.bt_range_editor_min
        data:
          value: "{{ [mid - tolerance_val, -120] | max }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.bt_range_editor_max
        data:
          value: "{{ [mid + tolerance_val, 0] | min }}"

  bt_beacon_range_editor_apply_percentile:
    alias: "BT: Apply P10/P90 percentile range to editor"
    description: "Sets range editor helpers to P10/P90 from scan history statistics"
    mode: single
    sequence:
      - variables:
          ctx: "{{ states('input_text.bt_range_editor_context').split('|') }}"
          p10: "{{ ctx[5] | int(0) if ctx | length > 5 else 0 }}"
          p90: "{{ ctx[6] | int(0) if ctx | length > 6 else 0 }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.bt_range_editor_min
        data:
          value: "{{ p10 }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.bt_range_editor_max
        data:
          value: "{{ p90 }}"

  bt_beacon_range_editor_save:
    alias: "BT: Save range editor values to fingerprint"
    description: "Reads min/max from helpers and writes directly to fingerprint. Preserves beacon format: min/max entries stay as min/max; mean entries save as rssi=midpoint. Swaps min/max if inverted."
    # `single` on purpose, where the other mutators are `queued`. Its inputs are two helpers filled by
    # the popup, so a queued second run would re-read whatever the helpers hold by then and write the
    # same values twice. One Save press is one write; a dropped double-press is the wanted behaviour.
    mode: single
    fields:
      browser_id:
        description: "Browser to close popup on after save"
        default: ""
    sequence:
      - variables:
          ctx: "{{ states('input_text.bt_range_editor_context').split('|') }}"
          new_min_raw: "{{ states('input_number.bt_range_editor_min') | int(none) }}"
          new_max_raw: "{{ states('input_number.bt_range_editor_max') | int(none) }}"

      # The popup fills all three of these before it opens, so reaching Save without them means the
      # save fired on its own - after a restart, before state restore, or from a stale dashboard. Bare
      # `| int` raised there ("int got invalid input ''"), which surfaces as a red error and no hint of
      # what to do; an empty context also makes ctx[1] an index error.
      - if: "{{ ctx | length < 2 or ctx[0] | int(-1) < 0 or not ctx[1]
                or new_min_raw is none or new_max_raw is none }}"
        then:
          - action: system_log.write
            data:
              message: "BT: range editor was asked to save with no usable popup state (context '{{ states('input_text.bt_range_editor_context') }}', min {{ states('input_number.bt_range_editor_min') }}, max {{ states('input_number.bt_range_editor_max') }}) - nothing saved"
              level: error
          - stop: "range editor state unusable"

      - variables:
          location_index: "{{ ctx[0] | int }}"
          mac_upper: "{{ ctx[1] | upper }}"
          current_fingerprints_raw: "{{ state_attr('sensor.bt_fingerprint_database_file', 'fingerprints') }}"
          current_fingerprints: "{{ current_fingerprints_raw or [] }}"

      - variables:
          new_min: "{{ [new_min_raw, new_max_raw] | min }}"
          new_max: "{{ [new_min_raw, new_max_raw] | max }}"

      # The existing entry decides the format written back: a range stays a range, a mean entry
      # takes the midpoint. Only the format is read here - the writer preserves `ignored`.
      - variables:
          existing: |
            {%- set ns = namespace(b={}) -%}
            {%- for fp in current_fingerprints if fp.loc | int == location_index -%}
              {%- for m, beacon in (fp.beacons or {}).items() if m | upper == mac_upper -%}
                {%- set ns.b = beacon -%}
              {%- endfor -%}
            {%- endfor -%}
            {{ ns.b }}

      # An unreadable database reads as "beacon absent" to the guard below, and this script stops before
      # browser_mod.close_popup, so the popup would sit open with nothing said anywhere. Name the cause.
      - if: "{{ current_fingerprints_raw is none }}"
        then:
          - action: system_log.write
            data:
              message: "BT: sensor.bt_fingerprint_database_file has no 'fingerprints' attribute - range editor save for {{ mac_upper }} not attempted, the database on disk is left alone"
              level: error
          - stop: "fingerprint database unreadable"

      # A beacon absent from this location's fingerprint has nothing to save into: set_beacon replaces
      # an entry, it never adds one, so the write would succeed as a no-op while the popup closed as
      # though the values had been stored. Same guard as reset_minmax and beacon_merge.
      - if: "{{ existing | length == 0 }}"
        then:
          - action: system_log.write
            data:
              message: "Beacon {{ mac_upper }} is not in the fingerprint at location {{ location_index }} - nothing to save"
              level: debug
          - stop: "beacon absent from this fingerprint"

      - action: script.bt_write_fingerprints
        data:
          operation: set_beacon
          location_index: "{{ location_index }}"
          mac: "{{ mac_upper }}"
          beacon: >-
            {{ {'min': new_min | int, 'max': new_max | int} if 'min' in existing
               else {'rssi': ((new_min + new_max) / 2) | round | int} }}
        response_variable: write_result

      # Leave the popup open on a refused write, so the values are still there to retry.
      - if: "{{ not (write_result.ok | default(true)) }}"
        then:
          - stop: "write refused"

      - action: browser_mod.close_popup
        data:
          browser_id: "{{ browser_id }}"

  bt_beacon_merge:
    alias: "BT: Merge beacon data"
    mode: queued
    max: 25
    description: "Merge a single beacon from the current scan into its fingerprint entry (expand min/max or update running mean)"
    fields:
      location_index:
        description: "Location index (0-based, required)"
        example: "0"
      mac:
        description: "Beacon MAC address (uppercase)"
        example: "DE:E3:0B:7D:6B:0B"
      browser_id:
        description: "Browser ID for toast notification (optional)"
        example: "peers_mobil"
    sequence:
      - variables:
          minmax_mode: "{{ states('input_boolean.bt_fingerprint_minmax_mode') | bool(false) }}"
          current_fingerprints_raw: "{{ state_attr('sensor.bt_fingerprint_database_file', 'fingerprints') }}"
          current_fingerprints: "{{ current_fingerprints_raw or [] }}"
          mac_upper: "{{ mac | upper }}"
          scan_devices: "{{ state_attr('sensor.bt_latest_scan_full', 'devices') or [] }}"

      - variables:
          scan_rssi: |
            {%- set ns = namespace(rssi=none) -%}
            {%- for device in scan_devices -%}
              {%- if device.mac | upper == mac_upper -%}
                {%- set ns.rssi = device.rssi -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.rssi }}

      - if:
          - condition: template
            value_template: "{{ scan_rssi is not none }}"
        then:
          # A range widens only if the scan falls outside it; a mean entry moves halfway towards the
          # scan. Both need the old value, so it is read here; the writer preserves `ignored`.
          - variables:
              existing: |
                {%- set ns = namespace(b={}) -%}
                {%- for fp in current_fingerprints if fp.loc | int == location_index | int -%}
                  {%- for m, beacon in (fp.beacons or {}).items() if m | upper == mac_upper -%}
                    {%- set ns.b = beacon -%}
                  {%- endfor -%}
                {%- endfor -%}
                {{ ns.b }}

          # An unreadable database reads as "beacon absent" to the guard below, at debug level and with
          # the wrong cause. Name it before concluding anything about the beacon.
          - if: "{{ current_fingerprints_raw is none }}"
            then:
              - action: system_log.write
                data:
                  message: "BT: sensor.bt_fingerprint_database_file has no 'fingerprints' attribute - merge of {{ mac_upper }} not attempted, the database on disk is left alone"
                  level: error
              - stop: "fingerprint database unreadable"

          # A beacon in the scan but not in this location's fingerprint has nothing to merge into, so
          # no write is issued. Both branches below read the existing entry, so without this the mean
          # branch would dereference a missing `rssi` and the run would fail.
          - if: "{{ existing | length == 0 }}"
            then:
              - action: system_log.write
                data:
                  message: "Beacon {{ mac_upper }} is not in the fingerprint at location {{ location_index }} - nothing to merge"
                  level: debug
              - stop: "beacon absent from this fingerprint"

          - action: script.bt_write_fingerprints
            data:
              operation: set_beacon
              location_index: "{{ location_index }}"
              mac: "{{ mac_upper }}"
              beacon: >-
                {{ {'min': [existing.min, scan_rssi | int] | min, 'max': [existing.max, scan_rssi | int] | max}
                   if 'min' in existing
                   else {'rssi': ((existing.rssi + scan_rssi | int) / 2) | round | int} }}
            response_variable: write_result

          - if: "{{ not (write_result.ok | default(true)) }}"
            then:
              - stop: "write refused"

          - variables:
              locations_list: "{{ state_attr('sensor.bt_location_array', 'locations') or [] }}"
              location_name: "{{ locations_list[location_index | int] if location_index | int >= 0 and location_index | int < locations_list | length else 'unknown' }}"

          - if:
              - condition: template
                value_template: "{{ browser_id is defined and browser_id != '' }}"
            then:
              - action: browser_mod.notification
                continue_on_error: true
                data:
                  browser_id: "{{ browser_id }}"
                  message: "Merged {{ mac_upper }} @ {{ location_name }} ({{ 'Min/Max' if minmax_mode else 'Mean' }})"
                  duration: 5000

          - action: system_log.write
            data:
              message: "Merged {{ mac_upper }} @ {{ location_name }} ({{ 'Min/Max' if minmax_mode else 'Mean' }})"
              level: info

  bt_beacon_reset_all:
    alias: "BT: Reset all beacons"
    mode: queued
    max: 25
    description: "Reset all beacons for a location. Min/max mode: P10/P90 if ≥10 samples, else midpoint±tolerance. Mean mode: current scan RSSI if present, else unchanged."
    fields:
      location_index:
        description: "Location index (0-based, required)"
        example: "0"
      browser_id:
        description: "Browser ID for toast notification (optional)"
        example: "peers_mobil"
    sequence:
      - variables:
          minmax_mode: "{{ states('input_boolean.bt_fingerprint_minmax_mode') | bool(false) }}"
          tolerance: "{{ states('input_number.bt_rssi_tolerance') | int(5) }}"
          current_fingerprints_raw: "{{ state_attr('sensor.bt_fingerprint_database_file', 'fingerprints') }}"
          current_fingerprints: "{{ current_fingerprints_raw or [] }}"
          scan_devices: "{{ state_attr('sensor.bt_latest_scan_full', 'devices') or [] }}"
          all_stats: "{{ state_attr('sensor.bt_merge_statistics', 'statistics') or [] }}"

      - variables:
          scan_map: |
            {%- set ns = namespace(map={}) -%}
            {%- for device in scan_devices -%}
              {%- set ns.map = ns.map | combine({device.mac | upper: device.rssi}) -%}
            {%- endfor -%}
            {{ ns.map }}

      # Only this location's beacons are rebuilt. `replace_location` takes the dict verbatim, so the
      # `ignored` flag is carried across here rather than by the writer.
      - variables:
          reset_beacons: |
            {%- set loc_stats_ns = namespace(beacons={}) -%}
            {%- for entry in all_stats if entry.loc | int == location_index | int -%}
              {%- set loc_stats_ns.beacons = entry.beacons -%}
            {%- endfor -%}
            {%- set loc_stats_map = loc_stats_ns.beacons -%}
            {%- set ns2 = namespace(beacons={}) -%}
            {%- for fp in current_fingerprints if fp.loc | int == location_index | int -%}
              {%- for m, beacon in (fp.beacons or {}).items() -%}
                {%- set mac_upper = m | upper -%}
                {%- set was_ignored = beacon.get('ignored', false) -%}
                {%- if minmax_mode -%}
                  {%- set readings = loc_stats_map.get(mac_upper, []) -%}
                  {%- set ns_rv = namespace(vals=[]) -%}
                  {%- for r in readings -%}{%- if r[0] is not none -%}{%- set ns_rv.vals = ns_rv.vals + [r[0]] -%}{%- endif -%}{%- endfor -%}
                  {%- set s_count = ns_rv.vals | length -%}
                  {%- if s_count >= 10 -%}
                    {%- set sorted_vals = ns_rv.vals | sort -%}
                    {%- set p10 = sorted_vals[(s_count * 0.1) | int] | int -%}
                    {%- set p90 = sorted_vals[(s_count * 0.9) | int] | int -%}
                    {%- set reset_beacon = {'min': p10, 'max': p90} -%}
                  {%- else -%}
                    {%- set mid = ((beacon.min + beacon.max) / 2) | round | int if 'min' in beacon else beacon.rssi | int -%}
                    {%- set reset_beacon = {'min': mid - tolerance, 'max': mid + tolerance} -%}
                  {%- endif -%}
                {%- else -%}
                  {# Mean mode: scan RSSI if present, else leave unchanged #}
                  {%- if mac_upper in scan_map -%}
                    {%- set reset_beacon = {'rssi': scan_map[mac_upper] | int} -%}
                  {%- else -%}
                    {%- set reset_beacon = beacon -%}
                  {%- endif -%}
                {%- endif -%}
                {%- if was_ignored -%}
                  {%- set reset_beacon = reset_beacon | combine({'ignored': true}) -%}
                {%- endif -%}
                {%- set ns2.beacons = ns2.beacons | combine({m: reset_beacon}) -%}
              {%- endfor -%}
            {%- endfor -%}
            {{ ns2.beacons }}

      # An unreadable database looks exactly like a location with no fingerprint to the guard below, and
      # that guard is quiet and names the wrong cause. Separate the two before deciding.
      - if: "{{ current_fingerprints_raw is none }}"
        then:
          - action: system_log.write
            data:
              message: "BT: sensor.bt_fingerprint_database_file has no 'fingerprints' attribute - reset-all at location {{ location_index }} not attempted, the database on disk is left alone"
              level: error
          - stop: "fingerprint database unreadable"

      # A location with no fingerprint yet has nothing to reset. Stop here rather than falling through
      # to a "Reset 0 beacons" toast and a statistics entry for a reset that did not happen - the same
      # early stop bt_beacon_reset_minmax and bt_beacon_merge use.
      - if: "{{ reset_beacons | length == 0 }}"
        then:
          - action: system_log.write
            data:
              message: "No fingerprint at location {{ location_index }} - nothing to reset"
              level: debug
          - stop: "no fingerprint at this location"

      - action: script.bt_write_fingerprints
        data:
          operation: replace_location
          location_index: "{{ location_index }}"
          beacons: "{{ reset_beacons }}"
        response_variable: write_result

      # Stop before the toast and before recording statistics, as capture and merge do.
      - if: "{{ not (write_result.ok | default(true)) }}"
        then:
          - stop: "write refused"

      - variables:
          locations_list: "{{ state_attr('sensor.bt_location_array', 'locations') or [] }}"
          location_name: "{{ locations_list[location_index | int] if location_index | int >= 0 and location_index | int < locations_list | length else 'unknown' }}"
          beacon_count: >
            {%- set fp = current_fingerprints | selectattr('loc', 'equalto', location_index | int) | list -%}
            {{ ((fp | first).beacons if fp | length > 0 else {}) | length }}

      - if:
          - condition: template
            value_template: "{{ browser_id is defined and browser_id != '' }}"
        then:
          - action: browser_mod.notification
            data:
              browser_id: "{{ browser_id }}"
              message: "Reset {{ beacon_count }} beacons @{{ location_name }}: {{ 'Min/Max (P10/P90 or ± ' + tolerance | string + ')' if minmax_mode else 'Mean' }}"
              duration: 5000

      - action: system_log.write
        data:
          message: "Reset all beacons\nLocation: {{ location_name }}\nBeacons: {{ beacon_count }}\nMode: {{ 'Min/Max (P10/P90 or ± ' + tolerance | string + ')' if minmax_mode else 'Mean (scan RSSI)' }}"
          level: info

      - action: script.bt_record_merge_statistics
        data:
          location_index: "{{ location_index }}"

  bt_record_merge_statistics:
    alias: "BT: Record merge statistics"
    mode: queued
    max: 25
    description: "Append current scan RSSI readings for a location to bt_statistics.json (called after capture/merge/reset)"
    fields:
      location_index:
        description: "Location index (0-based, required)"
        example: "0"
    sequence:
      - variables:
          current_stats: "{{ state_attr('sensor.bt_merge_statistics', 'statistics') or [] }}"
          raw_scan: "{{ state_attr('sensor.bt_latest_scan_full', 'devices') or [] }}"
          global_ignored: "{{ (state_attr('sensor.bt_ignored_beacons', 'ignored') or []) | map('upper') | list }}"
          current_fingerprints_raw: "{{ state_attr('sensor.bt_fingerprint_database_file', 'fingerprints') }}"
          ts: "{{ now().timestamp() | int }}"

      # Every beacon not in the fingerprint database is dropped from the statistics below, so an
      # unreadable database silently empties this location's readings - and the persistor cannot catch
      # it, because the entry count is unchanged and only its contents were lost.
      - if: "{{ current_fingerprints_raw is none }}"
        then:
          - action: system_log.write
            data:
              message: "BT: sensor.bt_fingerprint_database_file has no 'fingerprints' attribute - statistics for location {{ location_index }} not recorded, the file on disk is left alone"
              level: error
          - stop: "fingerprint database unreadable"

      - variables:
          scan_map: |
            {%- set ns = namespace(map={}) -%}
            {%- for device in raw_scan -%}
              {%- set mac_upper = device.mac | upper -%}
              {%- if mac_upper not in global_ignored -%}
                {%- set ns.map = ns.map | combine({mac_upper: device.rssi}) -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.map }}
          fp_mac_set: |
            {%- set ns = namespace(macs=[]) -%}
            {%- set fingerprints = current_fingerprints_raw or [] -%}
            {%- for fp in fingerprints -%}
              {%- if fp.loc | int == location_index | int -%}
                {%- for mac in fp.beacons.keys() -%}
                  {%- set ns.macs = ns.macs + [mac | upper] -%}
                {%- endfor -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.macs }}

      - variables:
          updated_statistics: |
            {%- set ns = namespace(stat_list=[], found=false) -%}
            {%- for entry in current_stats -%}
              {%- if entry.loc | int == location_index | int -%}
                {%- set ns.found = true -%}
                {%- set ns2 = namespace(beacons={}) -%}
                {%- for mac, readings in entry.beacons.items() -%}
                  {%- set mac_upper = mac | upper -%}
                  {%- if mac_upper in fp_mac_set -%}
                    {%- if mac_upper in scan_map -%}
                      {%- set new_readings = (readings + [[scan_map[mac_upper], ts]])[-50:] -%}
                    {%- else -%}
                      {%- set new_readings = (readings + [[none, ts]])[-50:] -%}
                    {%- endif -%}
                    {%- set ns2.beacons = ns2.beacons | combine({mac_upper: new_readings}) -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- for mac_upper, rssi in scan_map.items() -%}
                  {%- if mac_upper not in entry.beacons and mac_upper in fp_mac_set -%}
                    {%- set ns2.beacons = ns2.beacons | combine({mac_upper: [[rssi, ts]]}) -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- set ns.stat_list = ns.stat_list + [{'loc': location_index | int, 'beacons': ns2.beacons}] -%}
              {%- else -%}
                {%- set ns.stat_list = ns.stat_list + [entry] -%}
              {%- endif -%}
            {%- endfor -%}
            {%- if not ns.found -%}
              {%- set ns2 = namespace(beacons={}) -%}
              {%- for mac_upper, rssi in scan_map.items() -%}
                {%- if mac_upper in fp_mac_set -%}
                  {%- set ns2.beacons = ns2.beacons | combine({mac_upper: [[rssi, ts]]}) -%}
                {%- endif -%}
              {%- endfor -%}
              {%- set ns.stat_list = ns.stat_list + [{'loc': location_index | int, 'beacons': ns2.beacons}] -%}
            {%- endif -%}
            {{ {'statistics': ns.stat_list} }}

      - action: script.bt_persist_write
        data:
          data_type: statistics
          json_content: "{{ updated_statistics }}"
        response_variable: write_result

      - if: "{{ not (write_result.ok | default(true)) }}"
        then:
          - stop: "write refused"

      - action: system_log.write
        data:
          message: "Recorded merge statistics for location {{ location_index }}: {{ scan_map | length }} beacons from scan"
          level: debug

  bt_reset_detection_defaults:
    alias: "BT: Reset detection settings to defaults"
    mode: single
    sequence:
      - variables:
          # Every setting on the Settings view's algorithm card belongs in this table, and the
          # numbers match the `| int(…)` fallbacks at every site that reads these helpers, so a
          # reset and an unreadable helper produce the same detection behaviour.
          #
          # ⚠️ Three documents quote these same values and must agree: the README's Algorithm
          # Settings section, the Guide view's defaults table, and this map. A setting missing
          # here is skipped silently — the card offers to reset "every setting below".
          #
          # These helpers deliberately carry no `initial:`, which would re-apply on every
          # restart and discard tuning. Without one they start at their minimum instead, and
          # for the tolerance that minimum is 0 — an exact-match requirement that finds
          # nothing. Pressing this once is what makes a fresh install work.
          defaults:
            input_number.bt_rssi_tolerance: 5
            input_number.bt_weak_signal_threshold: -95

      - repeat:
          for_each: "{{ defaults | dictsort }}"
          sequence:
            - action: input_number.set_value
              target:
                entity_id: "{{ repeat.item[0] }}"
              data:
                value: "{{ repeat.item[1] }}"

      # The card's four switches are settings like the rest: ghost signals filtered out and min/max
      # fingerprints on — each beacon then carries its own tolerance, which beats one global ±N
      # chosen to suit every beacon at once. Random MACs and distance weighting off; the latter
      # failed verification and remains unreliable.
      - action: input_boolean.turn_on
        target:
          entity_id:
            - input_boolean.bt_filter_zero_rssi_signals
            - input_boolean.bt_fingerprint_minmax_mode
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.bt_include_random_macs
            - input_boolean.bt_distance_weighted_scoring

      # Fingerprints, location names and the ignore lists are not settings and are untouched.
      - action: system_log.write
        data:
          message: "BT Triangulation: detection settings restored to package defaults"
          level: info
          logger: bt_triangulation

  bt_report_beacon_status:
    alias: "BT: Report beacon status"
    description: "Generate and log beacon status report with per-beacon statistics and warnings"
    sequence:
      - variables:
          locations_list: "{{ state_attr('sensor.bt_location_array', 'locations') or [] }}"
          fingerprints: "{{ state_attr('sensor.bt_fingerprint_database_file', 'fingerprints') or [] }}"
          global_list: "{{ (state_attr('sensor.bt_ignored_beacons', 'ignored') or []) | map('upper') | list }}"
          weak_signal_threshold: "{{ states('input_number.bt_weak_signal_threshold') | int(-95) }}"
          tolerance: "{{ states('input_number.bt_rssi_tolerance') | int(5) }}"
          all_stats: "{{ state_attr('sensor.bt_merge_statistics', 'statistics') or [] }}"
          names_raw: "{{ state_attr('sensor.bt_device_names', 'devices_by_mac') or '{}' }}"

      - variables:
          validation_report: |
            === Beacon Status Report ===
            {%- set names_map = names_raw | from_json if names_raw is string else names_raw -%}
            {%- set report = namespace(lines=[], loc_warn_list=[]) -%}
            {%- for fp in fingerprints -%}
              {%- set idx = fp.loc -%}
              {%- set location_name = locations_list[idx] if idx >= 0 and idx < locations_list | length else (idx | string) -%}
              {%- set ns = namespace(total=0, active=0, weak=0, locally_ignored=0, warnings=0, beacon_lines=[]) -%}
              {%- set loc_stats = namespace(beacons={}) -%}
              {%- for stat_entry in all_stats -%}
                {%- if stat_entry.loc | int == idx | int -%}
                  {%- set loc_stats.beacons = stat_entry.beacons -%}
                {%- endif -%}
              {%- endfor -%}
              {%- for mac, beacon in fp.beacons.items() -%}
                {%- set mac_upper = mac | upper -%}
                {%- if mac_upper not in global_list -%}
                  {%- set rssi = ((beacon.min + beacon.max) / 2) | int if 'min' in beacon else beacon.rssi -%}
                  {%- set ns.total = ns.total + 1 -%}
                  {%- if beacon.get('ignored', false) -%}
                    {%- set ns.locally_ignored = ns.locally_ignored + 1 -%}
                  {%- else -%}
                    {%- set is_weak = rssi < weak_signal_threshold -%}
                    {%- if is_weak -%}
                      {%- set ns.weak = ns.weak + 1 -%}
                    {%- else -%}
                      {%- set ns.active = ns.active + 1 -%}
                    {%- endif -%}
                    {%- set bname = names_map.get(mac_upper, '?') -%}
                    {%- set fp_display = (beacon.min | string ~ '/' ~ beacon.max | string ~ ' dBm') if 'min' in beacon else (rssi | string ~ ' dBm') -%}
                    {%- set fp_span = ((beacon.max | int(0)) - (beacon.min | int(0))) | abs if 'min' in beacon else 0 -%}
                    {%- set is_wide = fp_span > 2 * tolerance -%}
                    {%- set s_readings = loc_stats.beacons.get(mac_upper, []) -%}
                    {%- set s_sessions = s_readings | length -%}
                    {%- set ns_miss = namespace(n=0) -%}
                    {%- for r in s_readings -%}{%- if r[0] is none -%}{%- set ns_miss.n = ns_miss.n + 1 -%}{%- endif -%}{%- endfor -%}
                    {%- set s_missing = ns_miss.n -%}
                    {%- set missing_pct = (s_missing * 100 / s_sessions) | round | int if s_sessions > 0 else 0 -%}
                    {%- set high_missing = s_sessions > 0 and missing_pct > 30 -%}
                    {%- set ns_rm = namespace(min_gap=0, max_gap=0) -%}
                    {%- set s_count = s_sessions - s_missing -%}
                    {%- if s_count > 0 -%}
                      {# Extract RSSI values, skipping null (absent) entries #}
                      {%- set ns_vals = namespace(vals=[]) -%}
                      {%- for r in s_readings -%}{%- if r[0] is not none -%}{%- set ns_vals.vals = ns_vals.vals + [r[0]] -%}{%- endif -%}{%- endfor -%}
                      {%- set s_vals = ns_vals.vals -%}
                      {# Mean #}
                      {%- set s_mean = (s_vals | sum) / s_count -%}
                      {# Standard deviation (population) #}
                      {%- set ns_std = namespace(sq=0) -%}
                      {%- for v in s_vals -%}{%- set ns_std.sq = ns_std.sq + (v - s_mean) ** 2 -%}{%- endfor -%}
                      {%- set s_stddev = ((ns_std.sq / s_count) ** 0.5) | round | int -%}
                      {# Drift: how far the fingerprint value has moved from the observed mean #}
                      {%- set s_drift = (rssi - s_mean) | round | int -%}
                      {%- set s_drift_str = ('+' if s_drift > 0 else '') ~ s_drift -%}
                      {# Time span: days between oldest and newest reading #}
                      {%- set s_span_days = (((s_readings[-1][1] - s_readings[0][1]) / 86400) | round | int) + 1 -%}
                      {%- set s_first_date = s_readings[0][1] | timestamp_custom('%y%m%d', true) -%}
                      {%- set s_last_date = s_readings[-1][1] | timestamp_custom('%y%m%d', true) -%}
                      {# Histogram: count readings per 3 dBm bucket, show non-empty buckets as -69(12) -66(5) #}
                      {%- set s_min = s_vals | min -%}
                      {%- set s_max = s_vals | max -%}
                      {%- set bucket_w = 3 -%}
                      {# Floor-align bucket boundaries to multiples of bucket_w #}
                      {%- set b_start = (s_min // bucket_w) * bucket_w -%}
                      {%- set b_end = (s_max // bucket_w) * bucket_w -%}
                      {# Initialize all buckets to 0 #}
                      {%- set ns_hist = namespace(buckets={}, max_count=0) -%}
                      {%- for b in range(b_start, b_end + bucket_w, bucket_w) -%}
                        {%- set ns_hist.buckets = ns_hist.buckets | combine({b: 0}) -%}
                      {%- endfor -%}
                      {# Count each reading into its bucket #}
                      {%- for v in s_vals -%}
                        {%- set bk = (v // bucket_w) * bucket_w -%}
                        {%- set ns_hist.buckets = ns_hist.buckets | combine({bk: ns_hist.buckets.get(bk, 0) + 1}) -%}
                      {%- endfor -%}
                      {# Find peak count (unused currently, kept for future bar scaling) #}
                      {%- for bk, cnt in ns_hist.buckets.items() -%}
                        {%- if cnt > ns_hist.max_count -%}{%- set ns_hist.max_count = cnt -%}{%- endif -%}
                      {%- endfor -%}
                      {# Build display string: only non-empty buckets, in ascending order #}
                      {%- set ns_hline = namespace(parts=[]) -%}
                      {%- for b in range(b_start, b_end + bucket_w, bucket_w) -%}
                        {%- set cnt = ns_hist.buckets.get(b, 0) -%}
                        {%- if cnt > 0 -%}
                          {%- set ns_hline.parts = ns_hline.parts + [b | string ~ '(' ~ cnt ~ ')'] -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {# Warning thresholds #}
                      {%- set high_sigma = s_stddev > (tolerance / 2) -%}
                      {%- set high_drift = (s_drift | abs) > tolerance -%}
                      {# Flag if fp bounds extend beyond observed stat range #}
                      {%- if 'min' in beacon -%}
                        {%- set ns_rm.min_gap = (s_min | int) - (beacon.min | int) -%}
                        {%- set ns_rm.max_gap = (beacon.max | int) - (s_max | int) -%}
                      {%- endif -%}
                    {%- else -%}
                      {%- set high_sigma = false -%}
                      {%- set high_drift = false -%}
                    {%- endif -%}
                    {%- set has_range_mismatch = ns_rm.min_gap > 0 or ns_rm.max_gap > 0 -%}
                    {%- set b_warnings = (1 if is_weak else 0) + (1 if high_sigma else 0) + (1 if high_drift else 0) + (1 if is_wide else 0) + (1 if has_range_mismatch else 0) + (1 if high_missing else 0) -%}
                    {%- set ns.warnings = ns.warnings + b_warnings -%}
                    {%- set warn_tag = '  ' ~ ('⚠' * b_warnings) if b_warnings > 0 else '' -%}
                    {%- set bl = ['  ' ~ mac_upper ~ '  ' ~ bname ~ warn_tag] -%}
                    {%- set bl = bl + ['    Fingerprint: ' ~ fp_display] -%}
                    {%- if s_count > 0 -%}
                      {%- set bl = bl + ['    Variation: deviation=' ~ s_stddev ~ ' dBm  drift=' ~ s_drift_str ~ ' dBm'] -%}
                      {%- set bl = bl + ['    Distribution: ' ~ (ns_hline.parts | join(' ')) ~ ' dBm'] -%}
                      {%- set bl = bl + ['    Samples: ' ~ s_count ~ ' samples, ' ~ s_span_days ~ ' days (' ~ s_first_date ~ '-' ~ s_last_date ~ ')'] -%}
                    {%- else -%}
                      {%- set bl = bl + ['    Samples: 0 samples (no statistics yet)'] -%}
                    {%- endif -%}
                    {%- if s_sessions > 0 -%}
                      {%- set bl = bl + ['    Missing: ' ~ s_missing ~ ' of ' ~ s_sessions ~ ' sessions (' ~ missing_pct ~ '%)' ~ ('  ⚠ intermittent' if high_missing else '')] -%}
                    {%- endif -%}
                    {%- if is_weak -%}
                      {%- set bl = bl + ['    ⚠ weak signal (fingerprint ' ~ rssi ~ ' dBm < threshold ' ~ weak_signal_threshold ~ ' dBm)'] -%}
                    {%- endif -%}
                    {%- if high_sigma -%}
                      {%- set bl = bl + ['    ⚠ high deviation (σ=' ~ s_stddev ~ ' dBm > tol/2=' ~ (tolerance / 2) | int ~ ' dBm)'] -%}
                    {%- endif -%}
                    {%- if high_drift -%}
                      {%- set bl = bl + ['    ⚠ drift (fingerprint=' ~ rssi ~ ' dBm, mean=' ~ (s_mean | round | int) ~ ' dBm, diff=' ~ s_drift_str ~ ' dBm)'] -%}
                    {%- endif -%}
                    {%- if is_wide -%}
                      {%- set bl = bl + ['    ⚠ wide range (span=' ~ fp_span ~ ' dBm > 2×tol=' ~ (2 * tolerance) ~ ' dBm)'] -%}
                    {%- endif -%}
                    {%- if has_range_mismatch -%}
                      {%- set rm_parts = namespace(p=[]) -%}
                      {%- if ns_rm.min_gap > 0 -%}{%- set rm_parts.p = rm_parts.p + ['fp min ' ~ ns_rm.min_gap ~ ' dBm below stat'] -%}{%- endif -%}
                      {%- if ns_rm.max_gap > 0 -%}{%- set rm_parts.p = rm_parts.p + ['fp max ' ~ ns_rm.max_gap ~ ' dBm above stat'] -%}{%- endif -%}
                      {%- set bl = bl + ['    ⚠ range outside stats (' ~ (rm_parts.p | join(', ')) ~ ')'] -%}
                    {%- endif -%}
                    {%- if high_missing -%}
                      {%- set bl = bl + ['    ⚠ intermittent (' ~ missing_pct ~ '% missing across ' ~ s_sessions ~ ' sessions)'] -%}
                    {%- endif -%}
                    {%- set ns.beacon_lines = ns.beacon_lines + bl + [''] -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {%- set loc_summary = location_name ~ ': ' ~ ns.active ~ ' active  (' ~ ns.total ~ ' total, ' ~ ns.weak ~ ' weak, ' ~ ns.locally_ignored ~ ' locally ignored' ~ (', ' ~ ns.warnings ~ ' warning' ~ ('s' if ns.warnings != 1 else '') if ns.warnings > 0 else '') ~ ')' -%}
              {%- set report.loc_warn_list = report.loc_warn_list + [{'loc': location_name, 'w': ns.warnings}] -%}
              {%- set report.lines = report.lines + ['', loc_summary, ''] + ns.beacon_lines -%}
            {%- endfor -%}
            {%- set ns_sum = namespace(warn_parts=[]) -%}
            {%- for item in report.loc_warn_list | sort(attribute='w') | reverse -%}
              {%- set ns_sum.warn_parts = ns_sum.warn_parts + [item.loc ~ '(' ~ item.w ~ ')'] -%}
            {%- endfor -%}
            {%- set summary = ['', '--- Summary ---', 'Warnings:  ' ~ (ns_sum.warn_parts | join('  ')), '---'] -%}
            {{ (summary + report.lines) | join('\n') }}

      - action: system_log.write
        data:
          message: "{{ validation_report }}"
          level: info

  bt_load_fingerprints_from_file:
    alias: "BT: Load fingerprints from file"
    description: "Refresh BT fingerprints sensor from file backup"
    sequence:
      # Force sensor to re-read current file contents
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.bt_fingerprint_database_file

  bt_persist_write:
    alias: "BT: Write data file"
    description: "Write one of the three JSON data files and refresh the sensor that reads it. Notifies on a refused write and returns {'ok': false} for the caller to act on."
    # The persistor refuses to overwrite a target that exists but does not parse, and exits 1.
    # Without checking that, the sensor re-reads the unchanged file and the dashboard redraws
    # identically, so a refused edit looks exactly like a successful one - and the file needs
    # manual repair before any further write can land. A persistent notification waits until
    # acknowledged, unlike a popup, which only reaches a dashboard someone is already looking at.
    # Returns {'ok': true|false}. Callers must check it and stop on false: a caller using
    # `action: script.…` waits for this script but carries on when it fails, so nothing else prevents
    # it logging success and toasting over a write that never landed.
    #
    # Deliberately not `stop … error: true`: Home Assistant rejects a response on an error stop
    # ("not allowed to add a response to an error stop action"), so the choice is a raised error or a
    # checkable outcome, never both. The outcome wins, because the error never aborted callers anyway -
    # it only marked this run failed. The ERROR line it used to contribute is written explicitly below.
    mode: queued
    max: 25
    fields:
      data_type:
        description: "Which file to write: fingerprints, ignored or statistics"
        example: "fingerprints"
      json_content:
        description: "Complete document for that file"
      allow_shrink:
        description: "Set only when removing entries is the intent. The persistor refuses a write holding fewer entries than the file already does without it."
        example: "true"
    sequence:
      - variables:
          targets:
            fingerprints:
              cmd: shell_command.bt_fingerprint_database_write
              sensor: sensor.bt_fingerprint_database_file
            ignored:
              cmd: shell_command.bt_ignored_write
              sensor: sensor.bt_ignored_beacons
            statistics:
              cmd: shell_command.bt_statistics_write
              sensor: sensor.bt_merge_statistics

      # The fingerprints and ignored commands read `allow_shrink`; the statistics one ignores it.
      - action: "{{ targets[data_type].cmd }}"
        data:
          json_content: "{{ json_content }}"
          allow_shrink: "{{ allow_shrink | default(false) | bool(false) }}"
        response_variable: shell_result

      - if: "{{ shell_result.returncode != 0 }}"
        then:
          - action: persistent_notification.create
            data:
              notification_id: "bt_write_failed_{{ data_type }}"
              title: "Triangulation: write failed"
              message: >-
                **bt_{{ data_type }}.json** was not written — the persistor refused it. Until the
                reason below is resolved, every edit to this file is discarded silently.
                {% if shell_result.stderr %}

                `{{ shell_result.stderr | trim }}`{% endif %}
          - action: system_log.write
            data:
              message: "BT: refused to write bt_{{ data_type }}.json - {{ shell_result.stderr | trim }}"
              level: error
          - variables:
              write_result:
                ok: false
          # `stop` does not render templates, so the file name lives in the notification and log only.
          - stop: "Data file write refused"
            response_variable: write_result

      - action: homeassistant.update_entity
        target:
          entity_id: "{{ targets[data_type].sensor }}"

      # A successful write means the file parses again, so clear any earlier refusal notice for it.
      # That notice says every edit is being discarded silently, which stops being true the moment a
      # write lands; left alone it outlives the condition it describes. Dismissing an id that was
      # never raised does nothing, so this needs no guard.
      - action: persistent_notification.dismiss
        data:
          notification_id: "bt_write_failed_{{ data_type }}"

      - variables:
          write_result:
            ok: true
      - stop: "written"
        response_variable: write_result

  bt_write_fingerprints:
    alias: "BT: Write fingerprints to file"
    description: "Apply one mutation to the fingerprint database and write it. Callers pass what to change, not a rebuilt document."
    # This script reads the database itself, so a caller describes its edit instead of rebuilding the
    # whole document from its own earlier read. Two scripts that both read before either writes used to
    # produce a lost update - the second write replaced the first wholesale, and nothing detected it
    # because the file stayed valid. `mode: queued` completes read-mutate-write-refresh for one caller
    # before the next begins, so the next one reads the result of the previous write.
    #
    # Entries the mutation does not touch are carried over as they are, locations included, so this
    # script needs to know only about the `ignored` flag and never about `rssi`/`min`/`max`. Adding a
    # field to a beacon requires no change here.
    mode: queued
    max: 25
    fields:
      operation:
        description: "set_beacon | remove_beacon | toggle_ignored | replace_location | clear"
        example: "set_beacon"
      location_index:
        description: "Location index. Omit on remove_beacon and toggle_ignored to act on every location."
        example: "0"
      mac:
        description: "Beacon MAC, for set_beacon, remove_beacon and toggle_ignored"
        example: "AA:BB:CC:DD:EE:FF"
      beacon:
        description: "New entry for set_beacon, e.g. {'rssi': -70} or {'min': -75, 'max': -65}. An existing 'ignored' flag is preserved."
      beacons:
        description: "Complete beacons dict for replace_location"
    sequence:
      - variables:
          # Read raw, with no `or []` fallback: a missing attribute means the database could not be
          # read, which is not the same as a database holding no fingerprints. An empty list here would
          # rebuild the document from nothing, and the persistor accepts that - its guard refuses a
          # target that does not parse, and a file it never managed to read still parses fine.
          current: "{{ state_attr('sensor.bt_fingerprint_database_file', 'fingerprints') }}"
          op: "{{ operation | default('') }}"
          target_mac: "{{ mac | default('') | upper }}"
          # `| int(-1)` turns an absent or non-numeric index into -1, which means "every location" -
          # but only for the two verbs that have an every-location meaning.
          target_loc: "{{ location_index | default(-1) | int(-1) }}"

      # Every verb except `clear` carries the untouched part of the document across from `current`, so
      # an unreadable sensor would replace a healthy file with an empty database. `none` is the
      # unreadable case and is refused; a database that genuinely holds nothing reads as `[]` and is
      # written normally. `clear` writes an empty document on purpose and needs no source to do it.
      - if: "{{ op != 'clear' and current is none }}"
        then:
          - action: system_log.write
            data:
              message: "BT: sensor.bt_fingerprint_database_file has no 'fingerprints' attribute - {{ op }} not written, the database on disk is left alone"
              level: error
          - variables:
              write_result:
                ok: false
          - stop: "fingerprint database unreadable"
            response_variable: write_result

      # `set_beacon` and `replace_location` act on exactly one location, so -1 is not a wider scope for
      # them, it is a caller error. Left unguarded, `replace_location` appends a `{'loc': -1}` entry
      # that readers resolve through `locations[-1]` - the *last* location, so it masquerades as a real
      # one - and `set_beacon` writes the beacon into every location. This is the same escalation the
      # scoped mutators guard against; the writer applies the rule to itself rather than trusting them.
      - if: "{{ op in ['set_beacon', 'replace_location'] and target_loc < 0 }}"
        then:
          - action: system_log.write
            data:
              message: "BT: {{ op }} needs a location index, got {{ location_index | default('none') }} - nothing written"
              level: error
          - variables:
              write_result:
                ok: false
          - stop: "location_index required"
            response_variable: write_result

      - variables:
          # Toggle direction. Scoped to one location it flips that entry; across all locations any
          # still-active entry means "ignore everywhere", so a mixed set collapses to fully ignored
          # rather than inverting each entry independently.
          turn_on_ignored: |
            {%- set ns = namespace(active=false) -%}
            {# `or []` because `clear` reaches this line with an unreadable database, which is the one
               case the guard above lets through. #}
            {%- for fp in (current or []) if target_loc < 0 or fp.loc | int == target_loc -%}
              {%- for m, b in (fp.beacons or {}).items() -%}
                {%- if m | upper == target_mac and not b.get('ignored', false) -%}
                  {%- set ns.active = true -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endfor -%}
            {{ ns.active }}

      - variables:
          mutated: |
            {%- if op == 'clear' -%}
              {{ {'fingerprints': []} }}
            {%- else -%}
              {%- set ns = namespace(fp_list=[]) -%}
              {%- for fp in current -%}
                {%- if op == 'replace_location' and fp.loc | int == target_loc -%}
                  {# dropped here; the replacement is appended after the loop #}
                {%- elif target_loc >= 0 and fp.loc | int != target_loc -%}
                  {%- set ns.fp_list = ns.fp_list + [fp] -%}
                {%- else -%}
                  {%- set ns2 = namespace(beacons={}) -%}
                  {%- for m, b in (fp.beacons or {}).items() -%}
                    {%- if m | upper != target_mac -%}
                      {%- set ns2.beacons = ns2.beacons | combine({m: b}) -%}
                    {%- elif op == 'set_beacon' -%}
                      {%- set kept = (beacon | combine({'ignored': true})) if b.get('ignored', false) else beacon -%}
                      {%- set ns2.beacons = ns2.beacons | combine({m: kept}) -%}
                    {%- elif op == 'toggle_ignored' -%}
                      {%- if turn_on_ignored | bool -%}
                        {%- set ns2.beacons = ns2.beacons | combine({m: b | combine({'ignored': true})}) -%}
                      {%- else -%}
                        {# Drop the flag by rebuilding without that key: Jinja cannot remove one. #}
                        {%- set ns3 = namespace(kept={}) -%}
                        {%- for k, v in b.items() if k != 'ignored' -%}
                          {%- set ns3.kept = ns3.kept | combine({k: v}) -%}
                        {%- endfor -%}
                        {%- set ns2.beacons = ns2.beacons | combine({m: ns3.kept}) -%}
                      {%- endif -%}
                    {%- endif -%}
                    {# remove_beacon: the matching entry is simply not carried over #}
                  {%- endfor -%}
                  {%- set ns.fp_list = ns.fp_list + [{'loc': fp.loc, 'beacons': ns2.beacons}] -%}
                {%- endif -%}
              {%- endfor -%}
              {%- if op == 'replace_location' -%}
                {%- set ns.fp_list = ns.fp_list + [{'loc': target_loc, 'beacons': beacons}] -%}
              {%- endif -%}
              {{ {'fingerprints': ns.fp_list} }}
            {%- endif -%}

      # A mutation that changes nothing - toggling a beacon at a location it is not in, removing one
      # that was never there - still serialised the whole document, replaced the file and refreshed the
      # sensor, and the caller then logged the edit as done. Compare first: an identical document is not
      # worth a write, and `changed` lets the caller say what actually happened.
      #
      # `current and` is load-bearing: a mutation off an EMPTY read also "changes nothing", but that is
      # the stale-sensor case, not a no-op. Skipping there would swallow the persistor's shrink refusal
      # and its notification - the only signal that the sensor is stale and the file needs a refresh.
      # An empty read therefore always goes to the persistor, which accepts it on a genuine first run
      # and refuses it when the file holds locations.
      #
      # Sorted because `replace_location` appends its rebuilt entry at the end while the persistor sorts
      # by `loc`, so an unsorted comparison would call an identical document changed.
      - if: "{{ current
                and (mutated.fingerprints | sort(attribute='loc')) == (current | sort(attribute='loc')) }}"
        then:
          - variables:
              write_result:
                ok: true
                changed: false
          - stop: "nothing to change"
            response_variable: write_result

      - action: script.bt_persist_write
        data:
          data_type: fingerprints
          json_content: "{{ mutated }}"
          # `clear` is the only verb that removes locations on purpose. Every other document holding
          # fewer than the file does is a rebuild from a database nobody could read, and is refused.
          allow_shrink: "{{ op == 'clear' }}"
        response_variable: persist_result

      - variables:
          write_result: "{{ persist_result | combine({'changed': persist_result.ok | default(true)}) }}"

      # Relayed so callers can check one script's result rather than two layers'.
      - stop: "written"
        response_variable: write_result

  bt_clear_fingerprints:
    alias: "BT: Clear fingerprints"
    mode: queued
    max: 25
    description: "Clear BT fingerprints database and refresh sensor"
    sequence:
      - action: script.bt_write_fingerprints
        data:
          operation: clear

  bt_clear_statistics:
    alias: "BT: Clear statistics"
    description: "Clear all scan history statistics and refresh sensor"
    # `single` on purpose, where the writers are `queued`: this is the one script that writes a data
    # file without going through script.bt_persist_write, and its payload is a fixed literal. Two
    # concurrent clears would write the same bytes, so dropping the second loses nothing.
    mode: single
    sequence:
      - action: shell_command.bt_statistics_clear

      # Refresh sensor to pick up changes
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.bt_merge_statistics

      - action: system_log.write
        data:
          message: "Cleared BT merge statistics"
          level: debug

automation:
  - alias: 'BT Calibration - Update Confusion Matrix'
    id: bt_confusion_matrix_update
    description: "Recalculate confusion matrix when fingerprints, locations, or thresholds change"
    triggers:
      - trigger: state
        entity_id:
          - sensor.bt_fingerprint_database_file
          - sensor.bt_location_array
          - input_number.bt_rssi_tolerance
          - input_number.bt_weak_signal_threshold
    actions:
      - delay: "00:00:05"
      - action: script.bt_generate_confusion_matrix
    mode: restart

  - alias: 'BT Fingerprints - Load from File on Startup'
    id: bt_fingerprints_load_on_startup
    description: "Ensure BT fingerprint sensor is refreshed at Home Assistant startup"
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.bt_fingerprint_database_file

  - alias: 'BT Location Scores - Update on Fingerprint or Ignore Changes'
    id: bt_location_scores_update_on_changes
    description: "Automatically run algorithm to update location scores when fingerprints or ignores change"
    triggers:
      - trigger: state
        entity_id:
          - sensor.bt_fingerprint_database_file
          - sensor.bt_ignored_beacons
          - input_boolean.bt_distance_weighted_scoring
    # NOTE: Timing issue - sensors may not be ready immediately after YAML reload
    # Condition checks all three sensors are valid to avoid errors during initialization
    conditions:
      - condition: template
        value_template: "{{ states('sensor.bt_fingerprint_database_file') is not none and states('sensor.bt_ignored_beacons') is not none and state_attr('sensor.bt_latest_scan_full', 'devices') is not none }}"
    actions:
      - action: script.bt_calculate_location_scores

  - alias: 'BT Phone Charger - Detect Location'
    id: bt_phone_charger_detect_location
    description: "Trigger on updated BT scan sensor, analyze filtered signals, detect and store charger location"
    triggers:
      # Trigger on sensor state change (timestamp updates on every webhook post)
      # Pipeline: webhook → sensor.bt_latest_scan_full (filters) → this automation (acts on filtered data)
      # This ensures filtering logic lives in one place only (the sensor), eliminating duplication
      - trigger: state
        entity_id: sensor.bt_latest_scan_full
    conditions:
      - condition: template
        value_template: "{{ trigger.to_state is not none and trigger.to_state.state not in ['unknown', 'unavailable'] }}"
    actions:
      # Log the already-filtered device data from the sensor
      - action: system_log.write
        data:
          message: |
            BT scan received:
            {%- for device in state_attr('sensor.bt_latest_scan_full', 'devices') or [] %}
            {{ device['mac'] }} | {{ (device['rssi'] | string).rjust(5) }} dBm | {{ device['name'] | default('unknown') }}
            {%- endfor %}
          level: info

      # Call location detection script with pre-filtered sensor data
      - action: script.bt_detect_charger_location
        data:
          browser_id: "{{ state_attr('sensor.bt_latest_scan_full', 'browser_id') }}"
          devices: "{{ state_attr('sensor.bt_latest_scan_full', 'devices') }}"

  - alias: 'BT Phone Charger - Clear Location'
    id: bt_phone_charger_clear_location
    description: "Receive power-disconnect event from Tasker, clear charger location for specific device"
    triggers:
      - trigger: webhook
        webhook_id: phone_charger_disconnect
        local_only: false
        # Triggered by Tasker when phone is removed from charger (power source disconnected)
        # Webhook receives JSON: {"browser_id": "peers_mobil", "event": "power_disconnected"}
    actions:
      # Remove only the disconnected device's entry from the location mapping
      - variables:
          # `from_json({})` is the whole guard: states() returns the string 'unknown' rather than an
          # undefined value, so a `default` filter here could never fire.
          current_mapping: "{{ states('input_text.bt_device_charger_locations') | from_json({}) }}"
          transform_pattern: "{{ state_attr('sensor.dashboard_logic_config', 'browser_id_transform_pattern') }}"
          regex_matches: "{{ trigger.json.browser_id | regex_findall(transform_pattern, ignorecase=True) }}"
          device_id: "{{ regex_matches[0] if regex_matches | length > 0 else trigger.json.browser_id }}"

      - if:
          - "{{ device_id in current_mapping }}"
        then:
          - variables:
              # Build new mapping without the disconnected device (using normalized device_id)
              updated_mapping: "{% set ns = namespace(result={}) %}{% for key, value in current_mapping.items() %}{% if key != device_id %}{% set ns.result = ns.result | combine({key: value}) %}{% endif %}{% endfor %}{{ ns.result }}"
              updated_mapping_json: "{{ updated_mapping | to_json }}"

          - action: input_text.set_value
            target:
              entity_id: input_text.bt_device_charger_locations
            data:
              value: "{{ updated_mapping_json }}"

          # Log location clearing with normalized device_id (see persistent notifications for details)
          - action: system_log.write
            data:
              message: "Phone charger location cleared for {{ device_id }} (power disconnected)"
              level: info
        else:
          # Warn if browser_id not found in mapping
          - action: system_log.write
            data:
              message: "Phone charger disconnect: browser_id '{{ trigger.json.browser_id }}' not found in location mapping. Available: {{ current_mapping.keys() | list }}. Check case sensitivity or device configuration."
              level: warning
