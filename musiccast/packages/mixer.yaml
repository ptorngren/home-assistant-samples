# ---------------------------------------------------------------------------
# MUSICCAST MIXER - Native MusicCast Favorites
# ---------------------------------------------------------------------------
# Uses presets/favorites directly on the scenario's master player
# instead of Music Assistant streams. Plays via device presets.

# -----------------------------------------------------------------------------
# SHELL COMMANDS
# -----------------------------------------------------------------------------
shell_command:
  # Fetch preset list from MusicCast device
  musiccast_get_presets: 'curl -s "http://{{ ip }}/YamahaExtendedControl/v1/netusb/getPresetInfo"'

  # Read randomization state: CSV file with preset_num,state pairs
  # Returns JSON: {"1": "normal", "3": "locked", "5": "excluded"}
  musiccast_randomization_read: 'bash /config/packages/musiccast/randomization_persistor.sh read "{{ scenario }}"'

  # Write randomization state: Save preset states to CSV file
  # Takes: scenario, csv_content (preset_num,state lines)
  musiccast_randomization_write: 'bash /config/packages/musiccast/randomization_persistor.sh write "{{ scenario }}" "{{ csv_content }}"'

# ================================================================
# RANDOMIZATION STATE CONSTANTS
# ================================================================
# - "L" (code_locked):   preset is locked; always selected during randomization
# - "X" (code_excluded): preset is excluded from random selection
# - "N" (code_normal):   the default. Stored by absence — no CSV row is written for it,
#                        so N exists at runtime but never in a file.
# Short codes minimize JSON size for 40-preset scenarios (helper 255 char limit).
#
# Every script that needs them opens with its own `variables:` block naming the three:
#
#   - variables:
#       code_normal: 'N'
#       code_locked: 'L'
#       code_excluded: 'X'
#
# so the templates below read `val == code_locked` rather than `val == 'L'`. The block is
# repeated per script on purpose rather than shared through a YAML anchor: an anchor would
# have to be defined on whichever script comes first, leaving the definition somewhere
# arbitrary and invisible from the sites that use it, and breaking every alias if the file
# is reorganised or a script moves to another file. A per-script block travels with its
# script. Any change to a code belongs in all of them, and in the dashboard — see below.
#
# Two places keep a bare literal, each marked where it sits: the randomization-locks
# sensor, whose Python runs inside a shell string, and the field descriptions on
# musiccast_set_favorite_state, which are prose.
#
# ⚠️  KEEP IN SYNC with dashboards/musiccast.yaml, which defines the same codes as its own
#     anchors at the top of that file. A YAML anchor cannot be referenced from another
#     file, so there is no way to share one definition between the two.

# ================================================================
# HELPERS - Scenario state management
# ================================================================

input_text:
  # Randomization state for the active scenario: JSON map {preset_num: state}
  # Loaded from CSV when active_scenario changes; no initial: so HA persists across restarts
  musiccast_presets_state:
    name: Randomization State (Active Scenario)
    max: 255

  # The player the favorite check is currently holding, as "entity|power|volume".
  # Written before the player is powered on and cleared once it is restored, so a run
  # that is killed rather than aborted leaves the one player it disturbed named here.
  # The next run restores it before starting. No initial: the value must survive a restart.
  musiccast_verify_snapshot:
    name: Favorite Check Snapshot
    max: 255

  # Slots that failed the favorite check, as "player/slot" separated by spaces, capped
  # at the helper's length. The full run is in the log; this only feeds the notification.
  musiccast_verify_failures:
    name: Favorite Check Failures
    max: 255

input_boolean:
  # Raised by a second hold while the check is running. The loops test it between slots
  # and stop doing work, which lets the run reach its own restore step rather than being
  # killed part-way through with a player left on and muted.
  musiccast_verify_abort:
    name: Abort Favorite Check

# -----------------------------------------------------------------------------
# TEMPLATE SENSORS
# -----------------------------------------------------------------------------
template:

  # The master currently in charge of a live group. The active scenario's master takes
  # precedence; with no scenario active it resolves the master of whatever group is
  # actually playing — the first member of a group is the master by design. Without this
  # fallback the Now Playing card goes blank whenever a scenario clears (an unhealed
  # drop, or players linked ad hoc) even though music is still playing. Powered-off
  # players are ignored: a group that survives power-off is not "currently playing".
  # A group needs at least one real member, so a player left alone is not a master —
  # accepted consequence: unlinking the last member drops Now Playing while the former
  # master keeps playing, until a scenario is activated again.
  - sensor:
      - name: "MusicCast Current Master"
        unique_id: musiccast_current_master
        state: >
          {%- set scenario = states('input_text.musiccast_active_scenario') -%}
          {%- set sc = state_attr('sensor.musiccast_scenarios', 'scenarios') or {} -%}
          {#- The blank-state list is spelled out here, where scripts and automations
              share a `blank_states` variable: a state-based template sensor has no
              `variables:` block to hold one. -#}
          {%- set scenario_master = sc.get(scenario, {}).get('master', '') if scenario not in ['', 'None', 'unknown', 'unavailable'] else '' -%}
          {%- if scenario_master -%}
            {{ scenario_master }}
          {%- else -%}
            {%- set pool = state_attr('group.musiccast_players', 'entity_id') or [] -%}
            {%- set ns = namespace(m='') -%}
            {%- for p in pool -%}
              {%- set gm = state_attr(p, 'group_members') or [] -%}
              {#- Real members only. The pool excludes stereo-pair slaves, which the
                  master keeps enrolled after its last real member leaves — counting
                  those would report a master of nothing. -#}
              {%- set real = gm | select('in', pool) | reject('eq', p) | list -%}
              {%- if ns.m == '' and real | length > 0 and gm[0] == p
                     and states(p) not in ['off', 'unavailable', 'unknown'] -%}
                {%- set ns.m = p -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.m }}
          {%- endif -%}

  # Provides Now Playing from whichever master is currently in charge.
  #
  # The tail of the artwork URL is appended to the state on purpose. The Now Playing
  # card is a config-template-card watching this sensor, but what it actually reads is
  # the `master` attribute below — and it re-renders on the state changing, so an
  # attribute that moves while the state stands still can leave the card showing the
  # previous master. entity_picture ends in a cache token that changes whenever the
  # artwork does, so carrying a slice of it in the state makes the state move whenever
  # the media does. The title alone is not enough: two stations can report the same
  # title, and artwork can change while it does not. Eight characters is simply enough
  # of the token to differ reliably.
  - sensor:
      - name: "MusicCast Scenario Now Playing"
        unique_id: musiccast_scenario_now_playing
        state: >
          {% set m = states('sensor.musiccast_current_master') %}
          {% set master = '' if m in ['', 'None', 'unknown', 'unavailable'] else m %}
          {% set title = state_attr(master, 'media_title') if master else 'Inget spelas' %}
          {% set artwork = state_attr(master, 'entity_picture') if master else '' %}
          {{ title }}{{ ' | ' ~ artwork[-8:] if artwork else '' }}
        attributes:
          master: >
            {% set m = states('sensor.musiccast_current_master') %}
            {{ '' if m in ['', 'None', 'unknown', 'unavailable'] else m }}

# ---------------------------------------------------------------------------
# SCRIPTS
# ---------------------------------------------------------------------------
# Scenario operations using native MusicCast:
# - Link players to master
# - Play random preset on master
# - Toggle scenario on/off by unlinking/turning off or linking/playing
script:

  # Link players to scenario's master
  # -------------------------------
  # The caller owns input_boolean.musiccast_scenario_updating: it must be ON before this
  # script runs and stay ON until the device has settled after playback starts,
  # long after the join here completes.
  musiccast_scenario_link:
    alias: "Scenario: Link"
    mode: restart
    fields:
      scenario:
        description: "Scenario name"
    sequence:
      # 1. Unlink all players
      - action: script.musiccast_unlink_all

      # 2. Get scenario config from CSV (line 1 = master, remaining = members)
      #    Falls back to sensor.musiccast_scenarios if no CSV yet
      - action: shell_command.musiccast_group_read
        data:
          scenario: "{{ scenario }}"
        response_variable: group_response
      - variables:
          csv_players: "{{ (group_response.stdout | default('[]') | trim) | from_json }}"
          sc: "{{ state_attr('sensor.musiccast_scenarios', 'scenarios') or {} }}"
          master: "{{ csv_players[0] if csv_players | length > 0 else sc.get(scenario, {}).get('master', '') }}"
          players: "{{ csv_players[1:] if csv_players | length > 1 else (sc.get(scenario, {}).get('players', []) | reject('eq', master) | list) }}"
          settle: "{{ states('input_number.musiccast_device_settle') | float(1) }}"

      # 2b. Drop members HA cannot reach. Calling join on an unavailable device raises
      # MusicCastConnectionException from the integration, and HA classes that as an
      # *unexpected* error — continue_on_error only suppresses HomeAssistantError, so
      # such a failure aborts the join loop, this script and the calling toggle, and
      # strands the guard. Not touching the dead device is the only reliable defence.
      - variables:
          reachable: "{{ expand(players) | rejectattr('state', 'in', ['unavailable', 'unknown']) | map(attribute='entity_id') | list }}"
      - variables:
          unreachable: "{{ players | reject('in', reachable) | list }}"
      - if: "{{ unreachable | length > 0 }}"
        then:
          - action: system_log.write
            data:
              message: "MusicCast: Scenario link {{ scenario }} — skipping unreachable members: {{ unreachable }}"
              level: warning
              logger: musiccast

      # An unreachable master cannot host the group at all, so stop with a clear reason
      # rather than failing obscurely on the first join.
      - if: "{{ states(master) in ['unavailable', 'unknown'] }}"
        then:
          - action: system_log.write
            data:
              message: "MusicCast: Scenario link {{ scenario }} — master {{ master }} is {{ states(master) }}, cannot start"
              level: error
              logger: musiccast
          # Also surface it in the UI: the scenario simply not starting is otherwise
          # indistinguishable from a tap that did not register. Fixed notification_id so
          # repeated attempts replace the notice instead of stacking up.
          - action: persistent_notification.create
            data:
              notification_id: musiccast_master_unreachable
              title: "MusicCast: scenario could not start"
              message: >-
                **{{ (state_attr('sensor.musiccast_scenarios_labels', 'scenarios') or {}).get(scenario, {}).get('name', scenario) }}** could not start —
                its master **{{ state_attr(master, 'friendly_name') or master }}**
                is {{ states(master) }}. Check that the device is powered and on the network,
                then try again.
          - stop: "Master {{ master }} unreachable"

      # 3. Stop any current playback on master
      - action: media_player.media_stop
        continue_on_error: true
        target:
          entity_id: "{{ master }}"
      # 1x the settle unit
      - delay:
          seconds: "{{ settle * 1 }}"

      # 4. Link other players to master, one at a time: an unreachable member raises,
      #    and a single call for the whole list lets that one member abort the whole
      #    activation. join is additive, so the group builds up member by member.
      - repeat:
          for_each: "{{ reachable }}"
          sequence:
            - action: media_player.join
              continue_on_error: true
              target:
                entity_id: "{{ master }}"
              data:
                group_members: "{{ [repeat.item] }}"
      # Wait for players to stabilize after joining (1x the settle unit)
      - delay:
          seconds: "{{ settle * 1 }}"

      # Name the members that never landed in the master's group — a skipped member
      # is otherwise invisible: the scenario just plays in fewer rooms.
      - variables:
          not_linked: "{{ reachable | reject('in', state_attr(master, 'group_members') or []) | list }}"
      - if: "{{ not_linked | length > 0 }}"
        then:
          - action: system_log.write
            data:
              message: "MusicCast: Scenario link {{ scenario }} — members did not join: {{ not_linked }}"
              level: warning
              logger: musiccast

  # Play random preset on master
  # ----------------------------
  musiccast_scenario_mixer:
    alias: "Scenario Mixer"
    mode: restart
    fields:
      scenario:
        description: "Scenario name"
      force_randomize:
        description: "Force new preset selection (ignore locks)"
        default: false
    sequence:
      # Raise the device guard for the whole mix. This script is also started directly —
      # dashboard double-tap re-randomize, screensaver — so it cannot rely on a caller
      # having raised it, and it owns the release: after the settle at the end, or before
      # an early stop. A caller that raised it first simply keeps it up until then.
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.musiccast_scenario_updating

      # 1. Get master and its IP
      - variables:
          blank_states: ['', 'None', 'unknown', 'unavailable']
          master: "{{ (state_attr('sensor.musiccast_scenarios', 'scenarios') or {}).get(scenario, {}).get('master', '') }}"
          player_name: "{{ master.replace('media_player.', '') }}"
      - variables:
          master_ip: "{{ (state_attr('sensor.musiccast_player_ips', 'by_entity') or {}).get(player_name, 'unknown') }}"

      # 2. Fetch presets from device
      - action: shell_command.musiccast_get_presets
        data:
          ip: "{{ master_ip }}"
        response_variable: preset_response

      # 3. Validate response before parsing
      - if:
          - condition: template
            value_template: "{{ preset_response.stdout | length == 0 }}"
        then:
          - action: system_log.write
            data:
              # An address alone identifies no room, so it never appears without the entity id.
              message: >-
                MusicCast: no preset response from {{ master }} ({{ master_ip }}) — check its
                entry in sensor.musiccast_player_ips, or re-run the network scan if its address changed.
              level: error
              logger: musiccast
          # No input type: nothing is playing, so the URI and the slot stay blank.
          - action: script.musiccast_set_source
            data:
              caption: "#error - see log#"
          # Release both flags on the way out — nothing is going to play, and leaving
          # them raised would mute drop detection and volume sync indefinitely and
          # keep the mini-player hidden.
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.musiccast_activation_in_progress
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.musiccast_scenario_updating
          - stop: "No response from {{ master }} ({{ master_ip }})"

      # 4. Parse and select random valid preset
      - variables:
          presets: "{{ (preset_response.stdout | from_json).preset_info }}"

      # Read randomization state (excluded/locked presets)
      - action: shell_command.musiccast_randomization_read
        data:
          scenario: "{{ scenario }}"
        response_variable: randomization_response

      - variables:
          randomization_state: "{{ (randomization_response.stdout | default('{}')) | from_json if (randomization_response.stdout | default('{}')) != '' else {} }}"
          # Randomization state codes, defined here for the whole file and aliased by the
          # scripts below — this is the first use, and a YAML alias cannot look ahead.
          # Only L and X are ever written: normal is stored by absence of a row, so N
          # exists at runtime but never reaches a CSV.
          code_normal: 'N'
          code_locked: 'L'
          code_excluded: 'X'

      # Check for a locked preset
      - variables:
          locked_preset_num: >
            {%- set ns = namespace(locked=0) -%}
            {%- for key, val in randomization_state.items() -%}
            {%- if val == code_locked -%}{%- set ns.locked = key | int -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.locked }}
      # If locked preset exists and NOT force_randomize, use it; otherwise select randomly from filtered list
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ locked_preset_num > 0 and not force_randomize }}"
            sequence:
              - variables:
                  preset_num: "{{ locked_preset_num }}"
                  preset_name: "{{ presets[locked_preset_num - 1].text if locked_preset_num > 0 else 'Unknown' }}"
                  preset_input: "{{ presets[locked_preset_num - 1].input if locked_preset_num > 0 else 'unknown' }}"
          - conditions: []
            sequence:
              - variables:
                  # Build list of valid preset indices (1-based), excluding "unknown" input and excluded presets
                  valid_indices: >
                    {% set ns = namespace(indices=[]) %}
                    {% for i in range(presets | length) %}
                      {% if presets[i].input != 'unknown' and presets[i].text != '' and randomization_state.get((i+1) | string) != code_excluded %}
                        {% set ns.indices = ns.indices + [i + 1] %}
                      {% endif %}
                    {% endfor %}
                    {{ ns.indices }}
                  preset_num: "{{ valid_indices | random if valid_indices else 1 }}"
                  preset_name: "{{ presets[preset_num - 1].text if preset_num > 0 else 'Unknown' }}"
                  preset_input: "{{ presets[preset_num - 1].input if preset_num > 0 else 'unknown' }}"

      # 4. Save preset slot, name and source type
      - action: script.musiccast_set_source
        data:
          preset: "{{ preset_num }}"
          caption: "{{ preset_name }}"
          input_type: "{{ preset_input }}"

      # Record timestamp for stale caption detection
      - action: input_text.set_value
        target:
          entity_id: input_text.musiccast_active_source_timestamp
        data:
          value: "{{ as_timestamp(now()) | int }}"

      # 6. Apply captured volumes BEFORE playback (avoid loud surprises)
      # Note: continue_on_error prevents volume apply failure from breaking scenario activation
      - action: script.musiccast_apply_volumes
        data:
          scenario: "{{ scenario }}"
        continue_on_error: true

      # 7. Play preset on master
      - action: media_player.play_media
        target:
          entity_id: "{{ master }}"
        data:
          media_content_id: "presets:{{ preset_num }}"
          media_content_type: music

      # The group is built and the right music is playing, so the now-playing state is
      # trustworthy from here — let the dashboard draw it rather than making it wait out
      # the settle below. A no-op on the direct re-randomize path, which never sets this.
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.musiccast_activation_in_progress

      # 8. Let the hardware settle before releasing the guard. The master reports its new
      # source/media_artist up to ~10 s after play_media, long after this script returns.
      # While the guard is down, that late device update is indistinguishable from an
      # external change: the volume sync scales the members off it, and
      # detect_stale_caption blanks a correct caption.
      - delay:
          seconds: "{{ states('input_number.musiccast_activation_settle') | int(0) }}"

      # 8a. Did it actually start? play_media and the device's own recallPreset both
      # report success even when the stored favorite is dead: the input is selected and
      # playback stops. Nothing downstream notices — the scenario is active, the favorite
      # is lit, and no room is playing. A wait rather than a bare test because
      # musiccast_activation_settle can be 0, which would read the state before the device
      # had any chance to start; this returns the moment it plays and only spends the
      # ceiling when it genuinely does not.
      - wait_template: "{{ is_state(master, 'playing') }}"
        timeout: "{{ states('input_number.musiccast_player_settle_timeout') | float(5) }}"
        continue_on_timeout: true

      # 8b. Recall once more before concluding anything. A device sometimes takes the
      # recall, selects the input and never starts: observed 2026-08-11 on a Spotify
      # favorite that sat idle for 64 s after the first attempt and played 1.6 s after
      # the second, with the same slot on the same player. So a stalled first attempt
      # says nothing about the favorite, and a second one is nearly free.
      - if:
          - condition: template
            value_template: "{{ not is_state(master, 'playing') }}"
        then:
          - action: media_player.play_media
            target:
              entity_id: "{{ master }}"
            data:
              media_content_id: "presets:{{ preset_num }}"
              media_content_type: music
          - wait_template: "{{ is_state(master, 'playing') }}"
            timeout: "{{ states('input_number.musiccast_player_settle_timeout') | float(5) }}"
            continue_on_timeout: true
          # Worth a line even when it works: a dropped recall is invisible once the
          # retry covers it, and how often it happens is the thing worth knowing.
          - if:
              - condition: template
                value_template: "{{ is_state(master, 'playing') }}"
            then:
              - action: system_log.write
                data:
                  message: >-
                    MusicCast: preset {{ preset_num }} "{{ preset_name }}" on {{ master }} ignored the
                    first recall and started on the second. The favorite is fine; the device dropped
                    the request.
                  level: info
                  logger: musiccast

      - if:
          - condition: template
            value_template: "{{ not is_state(master, 'playing') }}"
        then:
          # What this run selected and played, taken from the run rather than read back
          # from the helpers. The helpers are written by musiccast_set_source and are
          # blank whenever that write has not landed or a teardown cleared them, which
          # produces a notice naming no preset at all — useless exactly when something
          # has gone wrong. These three are always populated by the time playback is
          # attempted, and the input type distinguishes a dead Net Radio directory entry
          # from a Spotify reference, which fail for different reasons.
          - variables:
              dead_slot: "{{ preset_num }}"
              dead_caption: "{{ preset_name }}"
              dead_input: "{{ preset_input }}"
              dead_state: "{{ states(master) }}"
          - action: system_log.write
            data:
              message: >-
                MusicCast: preset {{ dead_slot }} "{{ dead_caption }}" ({{ dead_input or 'unknown input' }})
                on {{ master }} did not start on two recalls — master is {{ dead_state }}. The device
                accepted both and selected the input, so no layer reports an error. Two stalls in a
                row make the favorite a likelier cause than a dropped request, but neither is
                established: try the preset from the dashboard, and if it fails on every activation
                check it and consider re-saving from a live source. Selecting the same preset in the
                MusicCast app reports whether it is unavailable, which is the quickest confirmation.
                Start latency also varies by source, and only Net Radio, server lists and Spotify
                favorites have been tested in live use. A master that is `off` or `unavailable` is a
                different fault: the device never came up, so nothing was played to begin with.
              level: warning
              logger: musiccast
          # Surface it: silence is the only symptom, and nothing in the UI distinguishes a
          # dead favorite from a tap that never registered. Fixed notification_id so
          # repeated attempts replace the notice instead of stacking up.
          - action: persistent_notification.create
            data:
              notification_id: musiccast_preset_did_not_start
              title: "MusicCast: scenario is silent"
              # Phrased for every caller: the mixer also runs from a double-tap or the
              # screensaver with force_randomize, where nothing was "activated" and the
              # scenario may not even have been the active one.
              message: >-
                Preset **{{ dead_slot }}** ("{{ dead_caption }}", {{ dead_input or 'unknown input' }}) on
                **{{ state_attr(master, 'friendly_name') or master }}** was accepted but
                never started, so
                **{{ (state_attr('sensor.musiccast_scenarios_labels', 'scenarios') or {}).get(scenario, {}).get('name', scenario) }}**
                is silent. The player reports **{{ dead_state }}**, after two recalls.
                {% if dead_state in ['off', 'unavailable'] -%}
                That is the player never coming up rather than a bad favorite — check it is
                powered and on the network, then activate again.
                {%- else -%}
                Try the preset from the dashboard. If it plays there, this was more likely a
                dropped request than a bad favorite. If it fails there too, check the preset
                and consider re-saving it from a live source in the MusicCast app.
                {%- endif %}

      # 9. The device has settled, so its media_artist is now the truth about what is
      # streaming. A Net Radio preset stores a directory reference plus a label frozen
      # when the favorite was saved; if the broadcaster re-points the channel, the
      # preset plays a different station under the old name and no API reports it.
      # Show what is playing rather than the label, and name both in the log so the
      # drifted preset can be replaced or excluded. No retry — the request was
      # honoured, so playing it again would tune the same wrong station.
      # Net Radio only: for any other input the device reports track metadata rather
      # than a station, so there is nothing to compare and the label stands.
      # Compared case-insensitively: preset labels and stream metadata often differ
      # only in capitalisation for the same station.
      - variables:
          shown_caption: "{{ states('input_text.musiccast_active_source_caption') }}"
          playing_station: "{{ state_attr(master, 'media_artist') }}"
      - if:
          - condition: template
            value_template: >-
              {{ state_attr(master, 'source') == 'Net Radio'
                 and playing_station not in ['', none, 'unknown', 'unavailable']
                 and shown_caption not in blank_states
                 and (playing_station | trim | lower) != (shown_caption | trim | lower) }}
        then:
          - action: system_log.write
            data:
              message: >-
                MusicCast: preset "{{ shown_caption }}" on {{ master }} is playing
                "{{ playing_station }}" — showing the station that is actually streaming.
                The preset's stored station reference has drifted; re-save or replace it.
              level: warning
              logger: musiccast
          # Surface it for the same reason as the dead-favorite branch above: the music
          # plays, so nothing looks wrong, and the drift is only visible to someone who
          # knows what the preset was meant to be. Fixed notification_id per preset so a
          # second drifted preset gets its own notice rather than replacing this one.
          - action: persistent_notification.create
            data:
              notification_id: "musiccast_preset_drifted_{{ states('input_text.musiccast_active_source_preset') }}"
              title: "MusicCast: preset plays the wrong station"
              message: >-
                Preset **{{ states('input_text.musiccast_active_source_preset') }}** on
                **{{ state_attr(master, 'friendly_name') or master }}** is saved as
                "{{ shown_caption }}" but is streaming **{{ playing_station }}**.
                The broadcaster re-pointed the channel; the favorite still plays, so
                nothing is broken — re-save or replace it when convenient.
          # The slot is passed back unchanged: this branch runs right after this script
          # played it, so it still reproduces the station the device reports — only the
          # preset's stored label has drifted.
          - action: script.musiccast_set_source
            data:
              caption: "{{ playing_station }}"
              input_type: net_radio
              preset: "{{ states('input_text.musiccast_active_source_preset') }}"

      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.musiccast_scenario_updating

  # Toggle scenario on/off
  # ----------------------
  musiccast_scenario_toggle:
    alias: "Scenario: Toggle"
    mode: restart
    fields:
      scenario:
        description: "Scenario name (e.g. sauna, morning)"
        example: "sauna"
    sequence:
      - variables:
          blank_states: ['', 'None', 'unknown', 'unavailable']
      - variables:
          active_scenario: "{{ states('input_text.musiccast_active_scenario') }}"
          sc: "{{ state_attr('sensor.musiccast_scenarios', 'scenarios') or {} }}"
          is_active: "{{ active_scenario == scenario }}"
          current_master: "{{ sc.get(active_scenario, {}).get('master', '') if active_scenario else '' }}"
          # Live group_members — captures ad-hoc linked players, not just saved config
          # When toggling OFF: active_scenario == scenario, so current_master == target_master
          current_players_all: >-
            {{ (state_attr(current_master, 'group_members') or [])
               | select('in', state_attr('group.musiccast_players', 'entity_id') or [])
               | reject('eq', current_master) | list
               if current_master else [] }}

      # Unjoining or powering off a player HA cannot reach raises an unexpected error
      # that continue_on_error cannot suppress, aborting this script mid-teardown and
      # stranding the guard. Act only on the ones that can answer.
      - variables:
          current_players: "{{ expand(current_players_all) | rejectattr('state', 'in', ['unavailable', 'unknown']) | map(attribute='entity_id') | list }}"
          # A list so an unreachable master becomes an empty target, which HA treats as
          # a no-op, instead of a service call that raises.
          current_master_target: >-
            {{ [current_master] if current_master and states(current_master) not in ['unavailable', 'unknown'] else [] }}

      # Tap-to-restore: no scenario is active, the tapped scenario is the one that
      # was last active, and its master is still on — so a member dropped and the
      # scenario marker was cleared. Rejoin the missing members and restore the
      # marker instead of a fresh randomized activation; playback is left untouched
      # (no mixer, no re-randomize). Single-tap only — double-tap still re-randomizes.
      - if:
          - condition: template
            value_template: >-
              {{ active_scenario in blank_states
                 and scenario == states('input_text.musiccast_last_scenario')
                 and sc.get(scenario, {}).get('master', '')
                 and states(sc.get(scenario, {}).get('master', '')) not in ['off', 'unavailable', 'unknown'] }}
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.musiccast_active_scenario
            data:
              value: "{{ scenario }}"
          # Relight the playing favorite from the snapshot, but ONLY if the master's live
          # source still confirms it: a Net Radio station whose station name (media_artist)
          # still equals the snapshot caption. Any other case — a station/source change, or
          # any Spotify source (HA can't tell a playlist switch from the next track) — is
          # unconfirmable, so leave the caption blank rather than relight a wrong favorite.
          # Set the URI BEFORE the caption: writing a non-blank caption re-fires
          # musiccast_record_source, which re-snapshots last_uri from the live URI, so the
          # URI must already be in place.
          - variables:
              confirmed: >-
                {% set master = sc.get(scenario, {}).get('master', '') %}
                {% set snap = states('input_text.musiccast_last_caption') %}
                {{ snap not in blank_states
                   and state_attr(master, 'source') == 'Net Radio'
                   and state_attr(master, 'media_artist') == snap }}
          # The snapshot's URI is passed through rather than rebuilt: it was already
          # built from the input type that was playing, which the snapshot does not keep.
          - action: script.musiccast_set_source
            data:
              preset: "{{ states('input_text.musiccast_last_preset') if confirmed else '' }}"
              caption: "{{ states('input_text.musiccast_last_caption') if confirmed else '' }}"
              uri: "{{ states('input_text.musiccast_last_uri') if confirmed else '' }}"
          - action: script.musiccast_rejoin_missing_members
            data:
              manual: true
          - stop: "Tap-to-restore: rejoined {{ scenario }}"

      - if:
          - condition: template
            value_template: "{{ is_active }}"
        then:
          # Toggle OFF - unlink, stop and power off
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.musiccast_scenario_updating
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.musiccast_activation_in_progress
          # Blank: this path raises the same flags as an activation, and a stale target
          # would make a stalled shutdown report itself as a scenario that failed to start.
          - action: input_text.set_value
            target:
              entity_id: input_text.musiccast_activation_target
            data:
              value: ""

          - action: script.musiccast_teardown_group
            data:
              players: "{{ current_players }}"
              master: "{{ current_master_target }}"

          # Safe to clear only now: the teardown returns once the devices confirm they
          # are off, so the scenario is never cleared over a group still coming apart.
          # Via clear_scenario, not a direct write: the caption, uri and preset describe
          # what the scenario was playing and are meaningless once it is gone. Nothing
          # else clears them on this path — detect_manual_scenario would, but it is gated
          # on musiccast_scenario_updating, which is still up while the players power off
          # and comes down after this, leaving no trigger to fire.
          - action: script.musiccast_clear_scenario

          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.musiccast_activation_in_progress
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.musiccast_scenario_updating
        else:
          # Toggle ON / Switch scenario
          # Sequence: teardown old → link new → wait for HW → commit active_scenario → mix
          # active_scenario is set LAST so the UI re-renders once with accurate group_members,
          # avoiding a stale snapshot where players appear idle even though they're linked.
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.musiccast_scenario_updating
          # Hides the mini-player until the new group is playing — until then the
          # now-playing state still describes the outgoing scenario. The mixer clears
          # it once playback starts, well before the guard comes down.
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.musiccast_activation_in_progress
          # Record what is being started before touching any device. If a grouping call
          # raises, this script stops here and nothing downstream can report which
          # scenario was meant to play — active_scenario still names the outgoing one.
          - action: input_text.set_value
            target:
              entity_id: input_text.musiccast_activation_target
            data:
              value: "{{ scenario }}"

          # Step 1: Tear down the currently active scenario (if any)
          # current_master/current_players use live group_members so ad-hoc linked players
          # are also powered off, not just saved scenario members.
          - if:
              - condition: template
                value_template: "{{ current_master != '' }}"
            then:
              - action: script.musiccast_teardown_group
                data:
                  players: "{{ current_players }}"
                  master: "{{ current_master_target }}"

          # Step 2: Link new scenario group
          - action: script.musiccast_scenario_link
            data:
              scenario: "{{ scenario }}"

          # Step 3: Wait for group_members attribute to propagate from hardware to HA
          # Without this delay, active_scenario would be committed before HA sees the updated
          # group_members, causing the UI to render an idle snapshot instead of linked state.
          # ⚠️ Reads the helper directly rather than holding it in a variable: a variable set
          # before the scenario_link call above does not render in this step.
          - delay:
              seconds: "{{ (states('input_number.musiccast_device_settle') | float(1)) * 2 }}"

          # Step 4: Commit — triggers config-template-card re-render with accurate group state
          - action: input_text.set_value
            target:
              entity_id: input_text.musiccast_active_scenario
            data:
              value: "{{ scenario }}"
          - delay: 00:00:01
          # Step 5: Mix. The guard stays up across this call and the mixer releases it
          # once the devices have settled, so activation and a bare re-randomize get the
          # same protection.
          - action: script.musiccast_scenario_mixer
            data:
              scenario: "{{ scenario }}"
              force_randomize: false

  # Play preset by index on active scenario master
  # -----------------------------------------------
  musiccast_play_preset_by_index:
    alias: "MusicCast: Play Preset by Index"
    mode: restart
    fields:
      preset_index:
        description: "Preset index (1-based)"
    sequence:
      # Raise the device guard for the same reason the mixer does: the master reports
      # its new source/media_artist up to ~10 s after play_media, and with the guard
      # down that echo looks like an external change — detect_stale_caption would blank
      # the caption this script just set. Released after the settle below.
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.musiccast_scenario_updating

      - variables:
          active_scenario: "{{ states('input_text.musiccast_active_scenario') }}"

      - variables:
          master: "{{ (state_attr('sensor.musiccast_scenarios', 'scenarios') or {}).get(active_scenario, {}).get('master', '') }}"

      - variables:
          preset_info: >
            {% set all_presets = state_attr('sensor.musiccast_media_player_presets', 'presets') or {} %}
            {{ all_presets.get(master, []) }}

      - variables:
          preset: "{{ preset_info | selectattr('num', 'eq', preset_index | int) | first | default({}) }}"

      # The slot comes from the looked-up preset rather than the argument, so an index
      # that is not in the list leaves all three blank instead of naming a preset that
      # was never found.
      - action: script.musiccast_set_source
        data:
          preset: "{{ preset.get('num') or '' }}"
          caption: "{{ preset.get('text') or '' }}"
          input_type: "{{ preset.get('input') or '' }}"

      # Record timestamp for stale caption detection
      - action: input_text.set_value
        target:
          entity_id: input_text.musiccast_active_source_timestamp
        data:
          value: "{{ as_timestamp(now()) | int }}"

      - action: media_player.play_media
        target:
          entity_id: "{{ master }}"
        data:
          media_content_id: "presets:{{ preset_index }}"
          media_content_type: music

      # Same settle as scenario activation, then release the guard.
      - delay:
          seconds: "{{ states('input_number.musiccast_activation_settle') | int(0) }}"

      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.musiccast_scenario_updating

  # Favorite check — play every populated preset on every player and report the
  # slots that never start. Held from the Media Players header card.
  # ---------------------------------------------------------------------------
  musiccast_verify_favorites_toggle:
    alias: "MusicCast Admin: Start or abort the favorite check"
    mode: single
    sequence:
      - if: "{{ is_state('script.musiccast_verify_favorites', 'on') }}"
        then:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.musiccast_verify_abort
        else:
          # script.turn_on rather than calling it directly: this script must return
          # immediately, or it stays busy for the whole run and the second hold —
          # the one that aborts — is dropped as an overlapping call.
          - action: script.turn_on
            target:
              entity_id: script.musiccast_verify_favorites

  musiccast_verify_favorites:
    alias: "MusicCast Admin: Verify favorites"
    description: >-
      Play every populated preset on every player and report the ones that never start.
      Powers players on, mutes them, and restores volume and power afterwards. Minutes, not seconds.
    mode: single
    fields:
      player:
        description: "Limit the check to one player. Omit to check every player."
        example: media_player.kitchen
        selector:
          entity:
            domain: media_player
    sequence:
      # Refuse rather than ask: the run powers players on and off, and there is no
      # version of that which is safe over music someone is listening to.
      - if: "{{ states('input_text.musiccast_active_scenario') | trim not in ['', 'unknown', 'unavailable'] }}"
        then:
          - action: persistent_notification.create
            data:
              notification_id: musiccast_verify_favorites
              title: Favorite check not started
              message: >-
                A scenario is playing ({{ states('input_text.musiccast_active_scenario') }}).
                Stop it first — the check powers players on and off.
          - stop: A scenario is active

      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.musiccast_verify_abort

      # A run that was killed rather than aborted leaves the one player it was
      # holding named in the snapshot, at volume 0. Give it its volume back and
      # switch it off before starting.
      - variables:
          stale: "{{ states('input_text.musiccast_verify_snapshot') | trim }}"

      - if: "{{ stale | length > 0 and '|' in stale }}"
        then:
          - action: media_player.volume_set
            continue_on_error: true
            target:
              entity_id: "{{ stale.split('|')[0] }}"
            data:
              volume_level: "{{ stale.split('|')[1] | float(0.2) }}"
          - action: media_player.turn_off
            continue_on_error: true
            target:
              entity_id: "{{ stale.split('|')[0] }}"
          - action: input_text.set_value
            target:
              entity_id: input_text.musiccast_verify_snapshot
            data:
              value: ""

      - variables:
          all_presets: >-
            {% set every = state_attr('sensor.musiccast_media_player_presets', 'presets') or {} %}
            {% set one = player | default('', true) %}
            {{ {one: every.get(one, [])} if one else every }}
          # A dead favorite falls back to idle in well under a second; this only has to
          # outlast a slow device answering, not a slow stream reaching audio.
          wait_seconds: 15
          # A literal newline. Notification messages are markdown, and a YAML folded
          # scalar turns single newlines into spaces, so every deliberate line break
          # has to be concatenated in rather than typed.
          newline: "\n"

      # The run owns the house for its duration: every player it touches must be off
      # when it starts, and every one is off when it finishes. Anything gentler means
      # deciding per player whether to restore power, and a device that wakes itself
      # after teardown then goes unnoticed — both observed before this rule existed.
      - variables:
          # Only players the run will actually touch. The map also holds the passive
          # halves of stereo pairs, which carry no presets and are skipped by the run —
          # naming them here would ask for players to be switched off for no reason.
          already_on: >-
            {%- set ns = namespace(on=[]) -%}
            {%- for p, prs in all_presets.items() -%}
              {%- if prs | length > 0 and states(p) not in ['off', 'unavailable', 'unknown'] -%}
                {%- set ns.on = ns.on + [p] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.on }}

      - if: "{{ already_on | length > 0 }}"
        then:
          - action: persistent_notification.create
            data:
              notification_id: musiccast_verify_favorites
              title: Favorite check not started
              message: >-
                {{ already_on | map('replace', 'media_player.', '') | join(', ') }}
                {{ 'is' if already_on | length == 1 else 'are' }} switched on. The check needs every
                player off, and leaves them all off when it finishes — switch them off and start again.
          - stop: Players are switched on

      - variables:
          total: "{{ all_presets.values() | map('length') | sum }}"
          started_at: "{{ now().timestamp() | int }}"
          # MusicCast players the run cannot speak for. `unreachable` are in the preset
          # list but not answering; `uncovered` never made it into the list at all,
          # because the presets are fetched per device and one that was off or unplugged
          # at fetch time contributes nothing. Without naming them, "all N started" reads
          # as a clean bill of health for players that were never tested.
          unreachable: >-
            {%- set ns = namespace(u=[]) -%}
            {%- for p in all_presets.keys() -%}
              {%- if states(p) == 'unavailable' -%}{%- set ns.u = ns.u + [p] -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.u }}
          # Found through the device registry rather than integration_entities(): that
          # resolves entities via loaded config entries, so a player whose device is
          # unreachable is missing from it entirely — the one case this line exists to
          # report. The device registry keeps the entry regardless of whether the device
          # answers, so an unplugged player is still named.
          uncovered: >-
            {%- set ns = namespace(u=[]) -%}
            {%- if not (player | default('', true)) -%}
              {%- for e in states.media_player -%}
                {%- if device_attr(e.entity_id, 'manufacturer') == 'Yamaha Corporation'
                       and e.entity_id not in all_presets -%}
                  {%- set ns.u = ns.u + [e.entity_id] -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endif -%}
            {{ ns.u }}

      - action: input_text.set_value
        target:
          entity_id: input_text.musiccast_verify_failures
        data:
          value: ""

      - action: system_log.write
        data:
          logger: musiccast.verify
          level: info
          message: "Favorite check started — {{ total }} presets across {{ all_presets | length }} players"

      # Starting a job this long with no visible sign that it started is confusing, so
      # the notification goes up immediately and is rewritten per player as progress.
      # Same notification_id throughout, so the result replaces it rather than stacking.
      - action: persistent_notification.create
        data:
          notification_id: musiccast_verify_favorites
          title: Favorite check running
          message: >-
            {{ 'Starting — ' ~ total ~ ' favorites on ' ~ (all_presets | length) ~ ' players.'
               ~ newline ~ '**Hold the Media Players card again to abort.**' }}

      # Drop detection, volume sync and the caption check would all react to the churn
      # this creates, so the package is held for the whole run.
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.musiccast_scenario_updating

      - repeat:
          for_each: "{{ all_presets | dictsort }}"
          sequence:
            - variables:
                player: "{{ repeat.item[0] }}"
                presets: "{{ repeat.item[1] }}"
                player_index: "{{ repeat.index }}"

            # Aborting does not kill the run: the loops stop doing work and fall
            # through to the restore below, so no player is left on and muted.
            - if: >-
                {{ presets | length > 0
                   and is_state('input_boolean.musiccast_verify_abort', 'off')
                   and states(player) != 'unavailable' }}
              then:
                - action: persistent_notification.create
                  data:
                    notification_id: musiccast_verify_favorites
                    title: Favorite check running
                    message: >-
                      {%- set failed = states('input_text.musiccast_verify_failures') | trim -%}
                      {{ player.split('.')[1] ~ ' — player ' ~ player_index ~ ' of '
                         ~ (all_presets | length) ~ ', ' ~ (presets | length) ~ ' favorites.'
                         ~ ((' ' ~ (failed.split() | length) ~ ' failed so far.') if failed else '')
                         ~ newline ~ '**Hold the Media Players card again to abort.**' }}

                - action: media_player.turn_on
                  continue_on_error: true
                  target:
                    entity_id: "{{ player }}"

                - wait_template: "{{ states(player) not in ['off', 'unavailable', 'unknown'] }}"
                  timeout: 10
                  continue_on_timeout: true

                # Leave any group before driving this player through its presets. A device
                # keeps its group membership through standby, so "every player was off" does
                # not mean none of them is still enrolled — and playing a preset on a client
                # takes it out of the group by changing its input, without either device
                # being told. That leaves the pair inconsistent, which is one way a master
                # ends up holding a group its members have left.
                #
                # continue_on_error is deliberate but not sufficient on its own: a failing
                # group call raises MusicCastGroupException, which is not a HomeAssistantError
                # and therefore aborts the run. Nothing here depends on the unjoin succeeding,
                # so the risk is accepted rather than guarded.
                - action: media_player.unjoin
                  continue_on_error: true
                  target:
                    entity_id: "{{ player }}"

                # Read the volume only once the player is up: a powered-off player
                # reports None, and powering on resumes its last source at whatever
                # volume it holds. That value is what has to go back afterwards —
                # power does not, because every player ends the run switched off.
                - variables:
                    was_volume: "{{ state_attr(player, 'volume_level') | float(0.2) }}"

                - action: input_text.set_value
                  target:
                    entity_id: input_text.musiccast_verify_snapshot
                  data:
                    value: "{{ player }}|{{ was_volume }}"

                - action: media_player.volume_set
                  continue_on_error: true
                  target:
                    entity_id: "{{ player }}"
                  data:
                    volume_level: 0

                - repeat:
                    for_each: "{{ presets }}"
                    sequence:
                      # A player that goes unavailable part-way through its own list
                      # would otherwise report every remaining slot as a dead favorite.
                      - if: >-
                          {{ is_state('input_boolean.musiccast_verify_abort', 'off')
                             and states(player) != 'unavailable' }}
                        then:
                          - variables:
                              slot: "{{ repeat.item.num }}"
                              label: "{{ repeat.item.text }}"
                              # What the recall has to change. Reaching `playing` proves
                              # nothing here: the previous slot is normally still playing,
                              # and a recall that fails simply leaves it playing.
                              #
                              # Stopping the player first would make the transition
                              # cleaner but does not work — `media_stop` on Net Radio is
                              # undone by the device within tens of milliseconds, so the
                              # wait for it either times out or catches the bounce. The
                              # content comparison makes the stop unnecessary anyway.
                              before: "{{ state_attr(player, 'media_artist') }}|{{ state_attr(player, 'media_title') }}"

                          - action: media_player.play_media
                            continue_on_error: true
                            target:
                              entity_id: "{{ player }}"
                            data:
                              media_content_id: "presets:{{ slot }}"
                              media_content_type: music

                          - wait_template: >-
                              {{ is_state(player, 'playing')
                                 and (state_attr(player, 'media_artist') ~ '|' ~ state_attr(player, 'media_title')) != before }}
                            timeout: "{{ wait_seconds }}"
                            continue_on_timeout: true

                          # One stall may be a dropped request; two make the favorite
                          # the likelier cause. The retry is the discriminator, not a
                          # repair attempt.
                          - if: "{{ not wait.completed }}"
                            then:
                              - action: media_player.play_media
                                continue_on_error: true
                                target:
                                  entity_id: "{{ player }}"
                                data:
                                  media_content_id: "presets:{{ slot }}"
                                  media_content_type: music
                              - wait_template: >-
                                  {{ is_state(player, 'playing')
                                     and (state_attr(player, 'media_artist') ~ '|' ~ state_attr(player, 'media_title')) != before }}
                                timeout: "{{ wait_seconds }}"
                                continue_on_timeout: true

                          - if: "{{ not wait.completed }}"
                            then:
                              # Player and slot only — the label is looked up again for
                              # the notification, which keeps this inside 255 characters.
                              - action: input_text.set_value
                                target:
                                  entity_id: input_text.musiccast_verify_failures
                                data:
                                  value: >-
                                    {% set cur = states('input_text.musiccast_verify_failures') | trim %}
                                    {% set add = player.split('.')[1] ~ '/' ~ slot %}
                                    {{ ((cur ~ ' ' ~ add) if cur else add)[:255] }}

                          - action: system_log.write
                            data:
                              logger: musiccast.verify
                              level: info
                              message: >-
                                {{ 'ok' if wait.completed else 'FAILED' }} — {{ player }}
                                slot {{ slot }} "{{ label }}"

                - action: media_player.media_stop
                  continue_on_error: true
                  target:
                    entity_id: "{{ player }}"

                - action: media_player.volume_set
                  continue_on_error: true
                  target:
                    entity_id: "{{ player }}"
                  data:
                    volume_level: "{{ was_volume }}"

                # Unconditional: the run starts with every player off and ends the same
                # way. No verification here — a device with a live cloud session can
                # accept the power-off and wake itself again seconds later, so the only
                # check worth making is the final pass below, once nothing else is
                # happening.
                - action: media_player.turn_off
                  continue_on_error: true
                  target:
                    entity_id: "{{ player }}"

                - action: input_text.set_value
                  target:
                    entity_id: input_text.musiccast_verify_snapshot
                  data:
                    value: ""

      # Final pass, with the whole picture. A player powered off during its own teardown
      # can wake itself again while the run continues elsewhere — seen twice, both times
      # on a device holding a live cloud session — and the per-player step has long since
      # moved on. This is the only point that can see every player at once, and the run
      # promised to leave them all off.
      - repeat:
          for_each: "{{ all_presets | dictsort }}"
          sequence:
            - if: "{{ states(repeat.item[0]) not in ['off', 'unavailable', 'unknown'] }}"
              then:
                - action: media_player.turn_off
                  continue_on_error: true
                  target:
                    entity_id: "{{ repeat.item[0] }}"
                - action: system_log.write
                  data:
                    logger: musiccast.verify
                    level: info
                    message: "{{ repeat.item[0] }} woke up during the run — switched off again"

      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.musiccast_scenario_updating

      - variables:
          failures: "{{ states('input_text.musiccast_verify_failures') | trim }}"
          aborted: "{{ is_state('input_boolean.musiccast_verify_abort', 'on') }}"
          elapsed: "{{ (now().timestamp() | int) - (started_at | int) }}"

      - action: system_log.write
        data:
          logger: musiccast.verify
          level: info
          message: >-
            Favorite check {{ 'aborted' if aborted else 'finished' }} after {{ elapsed }} s —
            {{ failures.split() | length }} failed
            {{ 'of the slots reached' if aborted else 'of ' ~ total }}

      - action: persistent_notification.create
        data:
          notification_id: musiccast_verify_favorites
          title: >-
            {{ 'Favorite check aborted' if aborted else 'Favorite check' }}
          # Built as a list and joined on a real newline. A YAML folded scalar collapses
          # single newlines into spaces, which ran the headline and the first failure
          # together and left the rest as one block — the layout has to be explicit.
          message: >-
            {%- set all = state_attr('sensor.musiccast_media_player_presets', 'presets') or {} -%}
            {%- set failed = failures.split() -%}
            {%- set skipped = (unreachable + uncovered) | map('replace', 'media_player.', '') | list -%}
            {%- set ns = namespace(out=[]) -%}
            {#- An aborted run cannot speak for the slots it never reached, so it counts
                nothing against `total` — saying "all 221 started" after 23 s is a lie the
                report told once already. -#}
            {%- if failed | length == 0 and aborted -%}
              {%- set ns.out = ['Aborted after ' ~ elapsed ~ ' s. Nothing had failed yet, but most'
                    ~ ' favorites were never reached.'] -%}
            {%- elif failed | length == 0 -%}
              {%- set ns.out = ['All ' ~ total ~ ' favorites started (' ~ elapsed ~ ' s).'] -%}
            {%- elif aborted -%}
              {%- set ns.out = [failed | length ~ ' favorites did not start before the run was aborted after '
                    ~ elapsed ~ ' s. Re-save each one in the MusicCast app, then refresh the presets.'
                    ~ ' The rest were never reached.', ''] -%}
            {%- else -%}
              {%- set ns.out = [failed | length ~ ' of ' ~ total ~ ' favorites did not start ('
                    ~ elapsed ~ ' s). Re-save each one in the MusicCast app, then refresh the presets.', ''] -%}
              {%- for f in failed -%}
                {%- set p = 'media_player.' ~ f.split('/')[0] -%}
                {%- set n = f.split('/')[1] | int -%}
                {%- set label = (all.get(p, []) | selectattr('num', 'eq', n)
                      | map(attribute='text') | first) | default('unknown', true) -%}
                {%- set ns.out = ns.out + [f.split('/')[0] ~ ' slot ' ~ n ~ ': ' ~ label] -%}
              {%- endfor -%}
            {%- endif -%}
            {%- if skipped | length > 0 -%}
              {%- set ns.out = ns.out + ['', 'Not checked: ' ~ (skipped | join(', ')), '',
                    'These did not answer when the preset list was last fetched, so their favorites'
                    ~ ' are unknown. A player that is merely powered off is checked normally.'] -%}
            {%- endif -%}
            {{ ns.out | join(newline) }}

      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.musiccast_verify_abort

  # Set favorite randomization state (helper to update CSV)
  # -------------------------------------------------------
  musiccast_set_favorite_state:
    alias: "MusicCast: Set favorite randomization state"
    description: "Set a favorite state using short codes: 'N'=normal, 'L'=locked, 'X'=excluded"
    mode: single
    fields:
      scenario:
        description: "Scenario name"
        example: "sauna"
      preset_num:
        description: "Preset number (1-based)"
        example: "1"
      state:
        description: "State code: 'N'=normal, 'L'=locked, 'X'=excluded"
        example: "L"
    sequence:
      # Read current CSV as JSON
      - action: shell_command.musiccast_randomization_read
        data:
          scenario: "{{ scenario }}"
        response_variable: read_response

      - variables:
          code_normal: 'N'
          code_locked: 'L'
          code_excluded: 'X'

      # The preset states after this change, as a dict keyed by preset number.
      # Stays an object so the two derivations below can index it. Normal is stored by
      # absence: setting it drops the key instead of writing a row.
      - variables:
          final_map: >
            {% set raw_map = (read_response.stdout | default('{}')) | from_json %}
            {% set target_key = preset_num | string %}
            {% if state == code_normal %}
              {% set ns = namespace(result={}) %}
              {% for k, v in raw_map.items() %}
                {% if k != target_key %}
                  {% set ns.result = ns.result | combine({k: v}) %}
                {% endif %}
              {% endfor %}
              {{ ns.result }}
            {% else %}
              {{ raw_map | combine({target_key: state}) }}
            {% endif %}

      # Both derivations of final_map. A separate block because a variables: block is
      # evaluated as a single unit, so final_map is not visible inside its own block.
      - variables:
          # Keys sorted numerically; only locked and excluded are written, since a missing
          # row means normal.
          csv_lines: >
            {% set ns = namespace(lines=[]) %}
            {% for key_int in final_map.keys() | map('int') | sort %}
              {% set key_str = key_int | string %}
              {% if final_map[key_str] in (code_locked, code_excluded) %}
                {% set ns.lines = ns.lines + [key_str ~ ',' ~ final_map[key_str]] %}
              {% endif %}
            {% endfor %}
            {{ ns.lines | join('\n') }}
          # For the helper the dashboard reads. to_json, matching the other writer of
          # this helper — tojson spaces its separators, and the helper caps at 255 chars.
          final_state_map: "{{ final_map | to_json }}"

      # Write updated CSV back to file
      - action: shell_command.musiccast_randomization_write
        data:
          scenario: "{{ scenario }}"
          csv_content: "{{ csv_lines }}"

      # Refresh locks sensor (reads all CSV files — covers all scenarios)
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.musiccast_randomization_locks

      # Update active state helper only when this scenario is currently active
      - if:
          - condition: template
            value_template: "{{ scenario == states('input_text.musiccast_active_scenario') }}"
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.musiccast_presets_state
            data:
              value: "{{ final_state_map }}"

  # Toggle favorite excluded state (double-tap on preset)
  # -------------------------------------------------------
  musiccast_toggle_excluded:
    alias: "MusicCast: Toggle favorite from randomization"
    description: "Double-tap on preset: toggle excluded/normal state, or unlock if locked"
    mode: single
    fields:
      scenario:
        description: "Scenario name"
        example: "sauna"
      preset_num:
        description: "Preset number to toggle"
        example: "2"
    sequence:
      # Read current state for this preset
      - action: shell_command.musiccast_randomization_read
        data:
          scenario: "{{ scenario }}"
        response_variable: read_response

      - variables:
          code_normal: 'N'
          code_locked: 'L'
          code_excluded: 'X'

      # Determine next state: locked or excluded → normal, normal → excluded
      - variables:
          state_map: "{{ ((read_response.stdout | default('{}')) | from_json) if (read_response.stdout | default('{}')) != '' else {} }}"
          current_state: "{{ state_map.get(preset_num | string, code_normal) }}"
          next_state: "{% if current_state in (code_locked, code_excluded) %}{{ code_normal }}{% else %}{{ code_excluded }}{% endif %}"

      # Call set_favorite_state script with short code
      - action: script.musiccast_set_favorite_state
        data:
          scenario: "{{ scenario }}"
          preset_num: "{{ preset_num }}"
          state: "{{ next_state }}"

  # Lock a favorite (long-press on preset)
  # ----------------------------------------
  musiccast_lock_favorite:
    alias: "MusicCast: Lock favorite for randomization"
    description: "Long-press on preset: toggle lock (enforces single lock per scenario)"
    mode: single
    fields:
      scenario:
        description: "Scenario name"
        example: "sauna"
      preset_num:
        description: "Preset number to lock"
        example: "3"
    sequence:
      # Read current state
      - action: shell_command.musiccast_randomization_read
        data:
          scenario: "{{ scenario }}"
        response_variable: read_response

      - variables:
          code_normal: 'N'
          code_locked: 'L'

      # Determine next state and find any existing lock
      - variables:
          state_map: "{{ ((read_response.stdout | default('{}')) | from_json) if (read_response.stdout | default('{}')) != '' else {} }}"
          current_state: "{{ state_map.get(preset_num | string, code_normal) }}"
          next_state: "{% if current_state == code_locked %}{{ code_normal }}{% else %}{{ code_locked }}{% endif %}"
          existing_lock: >
            {%- set ns = namespace(lock_num=0) -%}
            {%- for k, v in state_map.items() -%}
            {%- if v == code_locked -%}{%- set ns.lock_num = k | int -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.lock_num }}

      # If locking and different preset already locked, unlock it first
      - if:
          - condition: template
            value_template: "{{ next_state == code_locked and existing_lock > 0 and existing_lock != preset_num | int }}"
        then:
          - action: script.musiccast_set_favorite_state
            data:
              scenario: "{{ scenario }}"
              preset_num: "{{ existing_lock }}"
              state: "N"

      # Then set target preset to next_state
      - action: script.musiccast_set_favorite_state
        data:
          scenario: "{{ scenario }}"
          preset_num: "{{ preset_num }}"
          state: "{{ next_state }}"

# ================================================================
# SENSOR: Randomization locks (one sensor covers all scenarios)
# ================================================================
command_line:
  - sensor:
      name: "MusicCast Randomization Locks"
      unique_id: musiccast_randomization_locks
      command: |
        python3 -c "
        import glob, json, os
        result = {}
        for f in sorted(glob.glob('/config/packages/musiccast/data/presets_*.csv')):
            scenario = os.path.basename(f).replace('presets_', '').replace('.csv', '')
            lock_num = 0
            try:
                for line in open(f):
                    parts = line.strip().split(',')
                    if len(parts) == 2 and parts[1].strip() == 'L':   # code_locked — see the header; a shell string takes no variable
                        lock_num = int(parts[0].strip())
                        break
            except Exception:
                pass
            if lock_num:
                result[scenario] = lock_num
        print(json.dumps({'locks': result}))
        "
      json_attributes:
        - locks
      value_template: "{{ value_json.locks | length }}"
      # As close to "never" as command_line allows: presets_*.csv changes only when a favorite
      # is locked or excluded from here, and those scripts refresh this sensor with
      # homeassistant.update_entity. media_players.yaml anchors the same value and explains it
      # in full; YAML anchors do not cross files, so this one is written out.
      scan_interval: 86400
      # Reads all presets_*.csv files and finds locked preset per scenario
      # Access via: state_attr('sensor.musiccast_randomization_locks', 'locks').get(scenario, 0)
      # Value: count of scenarios that have a locked preset

# ================================================================
# AUTOMATION: Refresh presets and randomization state on scenario change
# ================================================================
automation:
  - id: musiccast_refresh_master_presets
    alias: MusicCast Refresh Master Presets
    triggers:
      - trigger: state
        entity_id: input_text.musiccast_active_scenario
    actions:
      # Redundant in normal use (all presets already loaded), but re-fetches
      # in case device presets changed since last scan
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.musiccast_media_player_presets
      # Load randomization state for the newly active scenario
      - action: shell_command.musiccast_randomization_read
        data:
          scenario: "{{ states('input_text.musiccast_active_scenario') }}"
        response_variable: rand_response
      - variables:
          rand_state: "{{ (rand_response.stdout | default('{}')) | from_json if (rand_response.stdout | default('{}')) != '' else {} }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.musiccast_presets_state
        data:
          value: "{{ rand_state | to_json }}"
