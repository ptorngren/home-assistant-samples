# screensaver.yaml
# Screensaver Dashboard
# DEPENDENCIES: browser_mod (via HACS) - required for device-aware tap actions
#
# Browser Mod enables the dashboard to pass device identification (browser_id) to tap action scripts,
# allowing different devices to execute different actions from the same dashboard.
# See www/docs/screensaver-README.md for setup instructions.
#
# ARCHITECTURE: Decluttering-card template pattern for YAML anchor resolution
# - Design constants (colors, fonts) defined once with YAML anchors (&name) at top
# - Decluttering template uses [[variable]] placeholders (resolved by decluttering-card)
# - Views section passes YAML anchors as variables to template
# - Flow: YAML anchor (*color) → resolves to hex → passed to decluttering-card → [[variable]] substituted
# - Benefits: Single source of truth for all styling, no code duplication, works with nested cards
title: Screensaver Dashboard

# -------------------------------------------------------------------------------------
# CONFIGURATION
# -------------------------------------------------------------------------------------

# Locale configuration
# Edit this to change the date and time display format
locale: &locale sv-SE  # Swedish (Sweden)

# Design constants - single source of truth for styling
# Edit these values to customize the visual appearance of the screensaver.
# Font sizes control visual hierarchy; colors set the aesthetic tone.
colors:
  background: &color_bg "#080808"             # Near-black, not pure #000000: keeps OLED pixels faintly lit so drifting anti-burn-in elements don't smear
  primary_text: &color_primary "#8A7057"      # Warm gold/copper for time and date
  secondary_text: &color_secondary "#808080"  # Muted grey for climate data
  forecast_accent: &color_accent "#A0A0A0"    # Forecast temperatures (brightened from #666 for OLED contrast on high-DPI phones)
  alarm_highlight: &color_alarm "#C4A050"     # Brighter gold for alarm icon/time

font_sizes:
  # vmin = viewport min units (1vmin = 1% of the SMALLER viewport dimension)
  # Using vmin instead of px keeps the layout hardware-independent AND scales correctly in both
  # portrait and landscape. (Plain vw makes fonts huge on a wide landscape monitor; vmin tracks the
  # shorter side. On a portrait phone width < height, so vmin == vw — portrait stays unchanged.)
  time: &font_time 32vmin
  date: &font_date 8vmin
  temp: &font_temp 18vmin
  temp_small: &font_temp_small 14vmin
  climate: &font_climate 7vmin
  climate_details: &font_climate_details 7vmin
  alarm: &font_alarm 5vmin

# Temperature display thresholds
# - If temp string exceeds char_limit, font shrinks to prevent overflow, eg "-35.6 / -32.8°" (14 chars)
temp_char_limit: &char_limit 12

# Landscape (wide-screen) breakpoint
# The two-column wide layout activates when the viewport is at least this wide relative to its
# height (CSS min-aspect-ratio). "3/2" = width >= 1.5x height. Raise toward "16/9" to require a
# wider screen before switching; lower toward "7/5" to switch on a less-wide screen.
landscape_breakpoint: &landscape_breakpoint "3/2"

# -------------------------------------------------------------------------------------
# DECLUTTERING TEMPLATES
# -------------------------------------------------------------------------------------
decluttering_templates:
  screensaver_template:
    card:
      type: custom:button-card
      # Pass the anchor values into card variables
      variables:
        locale: '[[locale]]'
        char_limit: '[[char_limit]]'
        font_temp: '[[font_temp]]'
        font_temp_small: '[[font_temp_small]]'
        # browser_id is resolved dynamically at runtime via JavaScript from browser_mod localStorage
      card_mod:
        style: >
          /* Animation testing multipliers: adjust both speed AND size (use to debug and verify) */
          :host {
            --anim-speed-mult: 1;    /* Speed multiplier: 1=normal, 2=2x faster, 5=5x faster */
            --anim-size-mult: 1;     /* Size multiplier: 1=normal, 2=2x larger drift, 5=5x larger */
          }

          /* Soft motion to prevent screen burn-in */
          @keyframes drift-slow {
            0%    { transform: translate(0px, 0px); }
            50%   { transform: translate(calc(8px * var(--anim-size-mult)), calc(6px * var(--anim-size-mult))); }
            100%  { transform: translate(calc(-8px * var(--anim-size-mult)), calc(-6px * var(--anim-size-mult))); }
          }
          @keyframes drift-fast {
            0%    { transform: translate(0px, 0px); }
            50%   { transform: translate(calc(-6px * var(--anim-size-mult)), calc(4px * var(--anim-size-mult))); }
            100%  { transform: translate(calc(6px * var(--anim-size-mult)), calc(-4px * var(--anim-size-mult))); }
          }
          /* Attach animations to elements at varied speeds for an organic feel */
          #container { animation: drift-slow calc(240s / var(--anim-speed-mult)) ease-in-out infinite alternate; }
          #date { animation: drift-fast calc(180s / var(--anim-speed-mult)) linear infinite alternate !important; }
          #time { animation: drift-fast calc(180s / var(--anim-speed-mult)) linear infinite alternate !important; }
          #temp { animation: drift-slow calc(240s / var(--anim-speed-mult)) linear infinite alternate !important; }
          #climate { animation: drift-slow calc(240s / var(--anim-speed-mult)) linear infinite alternate !important; }
          #climate_details { animation: drift-slow calc(240s / var(--anim-speed-mult)) linear infinite alternate !important; }
          #alarm { animation: drift-slow calc(240s / var(--anim-speed-mult)) linear infinite alternate !important; }
          #forecast { animation: drift-fast calc(200s / var(--anim-speed-mult)) linear infinite alternate !important; }

          /* Wide / desktop monitors: a two-column TOP section — LEFT = clock (date + time),
             RIGHT = weather summary (temp, conditions, humidity/wind) with the forecast beneath it
             confined to the RIGHT column (left cell of that row is empty). Implemented as a real CSS media query so
             it re-flows automatically on resize (button-card style JS only evaluates once at render
             time, so it could not be relied on here). #container is the button-card grid element.
             Keyed on min-aspect-ratio (width >= 1.5x height), NOT orientation: the fonts scale with
             vmin (the shorter side) while the columns are 50% width, so on a narrow/near-square
             landscape window the big time/temp overflow their half-columns and collide. Requiring a
             genuinely wide aspect ratio keeps two columns only where the content actually fits;
             narrower windows fall back to the single-column stack (which has full width for them). */
          @media (min-aspect-ratio: [[landscape_breakpoint]]) {
            #container {
              grid-template-columns: 1fr 1fr !important;
              grid-template-rows: auto auto auto auto !important;
              grid-template-areas:
                "date     temp"
                "time     climate"
                "time     climate_details"
                ".        forecast" !important;
              /* Fill the viewport so the inherited align-content:center can vertically centre the
                 (short) landscape composition instead of letting it sit pinned to the top. */
              min-height: 100vh !important;
            }
            /* Centre the content within each pane (each half-column): symmetric, and avoids the
               ragged left edge of right-aligned weather. date<->temp align at the top row; the big
               time spans down next to conditions + humidity; the forecast sits below them in the right pane. */
            #date, #time, #temp, #climate, #climate_details { justify-self: center !important; }
            #time { font-size: 22vmin !important; width: auto !important; margin-bottom: 0 !important; align-self: start !important; }
            /* Temp: cap by WIDTH too (the inner div is sized by JS in vmin, i.e. by height) so a long
               dual-temp like "19° / 27.4°" can't outgrow its half-column and clip at the screen edge. */
            #temp div { font-size: min(14vmin, 6vw) !important; }
            /* Forecast: confined to the RIGHT pane (under temp/climate), filling that column. */
            #forecast { justify-self: center !important; width: 100% !important; margin-top: 2vh !important; }
          }

      show_name: false
      show_state: false
      
      custom_fields:
        # Current date with locale formatting
        date: >
          [[[
            return new Date().toLocaleDateString(variables.locale, { weekday: 'long', day:
            '2-digit', month: 'long' });
          ]]]
        
        # Current time display
        time: |
          [[[ return states['sensor.time']?.state ?? ''; ]]]
        
        # Temperature display with conditional font sizing
        # State is always an array: [avg] or [lo, hi], allowing for any number of temperatures
        temp: |
          [[[
            try {
              const temps = JSON.parse(states['sensor.screensaver_display_temperature']?.state);
              const tempDisplay = temps.map(t => `${t}°`).join(' / ');
              const charLimit = parseInt(variables.char_limit);
              const fontSize = tempDisplay.length > charLimit ? variables.font_temp_small : variables.font_temp;
              return `<div style="font-size: ${fontSize};">${tempDisplay}</div>`;
            } catch (e) {
              return '--°';
            }
          ]]]
        
        # Weather description
        climate: |
          [[[
            return states['sensor.screensaver_display_weather']?.state ?? '';
          ]]]
        
        # Humidity and wind with middle dot separator
        climate_details: |
          [[[
            const humidity = parseFloat(states['sensor.screensaver_display_humidity']?.state)?.toFixed(0);
            const wind = states['sensor.screensaver_display_wind_speed']?.state;
            const dir = states['sensor.screensaver_display_wind_direction']?.state;

            const humidityValid = humidity && humidity !== 'unavailable' && humidity !== 'unknown';
            const windValid = wind && wind !== 'unavailable' && wind !== 'unknown';
            const dirValid = dir && dir !== 'unavailable' && dir !== 'unknown' && parseFloat(wind) > 0;

            const windStr = windValid ? (dirValid ? `${wind} m/s ${dir}` : `${wind} m/s`) : null;

            if (!humidityValid && !windStr) return '';
            if (!humidityValid) return windStr;
            if (!windStr) return `${humidity} %`;

            return `${humidity} % · ${windStr}`;
          ]]]

        # Next alarm time for the active device (device-specific, via HA Companion App)
        # Device identifier may be transformed or extended by local implementation
        # Companion App provides alarm time in ISO 8601 format (e.g., "2026-01-30T07:30:00")
        alarm: |
          [[[
            // Get browser_id from browser_mod
            const browserId = localStorage.getItem('lovelace-player-device-id');
            if (!browserId) return '';

            // Fetch transformation rules from config sensor (defined in local package)
            const configSensor = states['sensor.dashboard_logic_config'];
            if (!configSensor?.attributes) return '';

            const pattern = configSensor.attributes.browser_id_transform_pattern;
            const replacement = configSensor.attributes.alarm_id_replacement;
            if (!pattern || !replacement) return '';

            // Apply regex transformation to construct sensor entity_id (case-insensitive)
            const regex = new RegExp(pattern, 'i');
            const alarmSensorId = browserId.replace(regex, replacement);
            const alarmState = states[alarmSensorId]?.state;

            // Silently return empty if sensor not found or unavailable
            if (!alarmState || alarmState === 'unavailable' || alarmState === 'unknown') {
              return '';
            }

            try {
              // Parse ISO 8601 timestamp from Companion App and format using locale
              const alarmTime = new Date(alarmState);
              // Only display if alarm is at least 5 minutes in the future (grace period)
              const now = new Date();
              const fiveMinutesFromNow = new Date(now.getTime() + 5 * 60000);
              if (alarmTime <= fiveMinutesFromNow) {
                return '';
              }
              const locale = variables.locale || 'en-US';
              // Format as HH:MM (24-hour) in the device's locale
              const timeStr = alarmTime.toLocaleTimeString(locale, {
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
              });
              // Return with alarm icon
              return `⏰ ${timeStr}`;
            } catch (e) {
              return '';
            }
          ]]]

        # Charger location + battery charge indicator (top right)
        # Combines the detected charger location and the device's battery level as "location:charge%".
        # Both are device-aware via the same Browser ID transform used by the alarm field:
        #   - location  ← input_text.device_charger_locations mapping (only set while docked on a known charger)
        #   - charge    ← sensor.{device_id}_battery_level (Companion App; shown whenever the sensor has a value)
        # Falls back to whichever is present: "location:84%" (both) / "84%" (no location) / "location" (no battery).
        charger_location: |
          [[[
            // Get browser_id from browser_mod localStorage
            const browserId = localStorage.getItem('lovelace-player-device-id');
            if (!browserId) return '';

            // Fetch transformation rules from config sensor (same as alarm display)
            const configSensor = states['sensor.dashboard_logic_config'];
            const pattern = configSensor?.attributes?.browser_id_transform_pattern;
            if (!pattern) return '';

            // Apply regex to transform from browser_id to mapping key (e.g. by stripping Fully Kiosk Browser suffix)
            const regex = new RegExp(pattern, 'i');
            const mappingKey = browserId.replace(regex, '$1');

            // Read device-to-location JSON mapping from helper
            let location = '';
            const mappingJson = states['input_text.device_charger_locations']?.state;
            if (mappingJson) {
              try {
                const loc = JSON.parse(mappingJson)[mappingKey];
                if (loc && loc !== 'unknown') location = loc;
              } catch (e) { /* ignore malformed mapping */ }
            }

            // Resolve battery charge level (device-agnostic, same Browser ID transform)
            let charge = '';
            const replacement = configSensor.attributes.battery_level_replacement;
            if (replacement) {
              const batteryLevel = states[browserId.replace(regex, replacement)]?.state;
              if (batteryLevel && batteryLevel !== 'unavailable' && batteryLevel !== 'unknown') {
                charge = `${batteryLevel}%`;
              }
            }

            // Combine as "location:charge", falling back to whichever is present
            if (location && charge) return `${location}:${charge}`;
            return location || charge;
          ]]]

        # Embedded weather forecast card
        forecast:
          card:
            type: weather-forecast
            entity: weather.forecast_home
            show_current: false
            show_forecast: true
            forecast_type: daily
            forecast_slots: 5
            card_mod:
              style: |
                ha-card {
                  /* Fix the YAML anchor limitation by using Decluttering Card variables.
                     The [[variable]] strings are replaced with hex values before parsing. */
                  background: transparent !important;
                  border: none !important;
                  box-shadow: none !important;
                  --primary-text-color: [[color_secondary]] !important;
                  --secondary-text-color: [[color_accent]] !important;
                  --paper-item-icon-color: [[color_primary]] !important;
                  font-size: clamp(10px, 2.5vw, 18px);
                }
                .card-header { display: none !important; }
                .forecast .temp { font-size: 1.2em !important; font-weight: 500 !important; }
                /* Wide screens (matches the two-column breakpoint): the 18px cap makes the forecast
                   tiny on a wide monitor — enlarge it. */
                @media (min-aspect-ratio: [[landscape_breakpoint]]) {
                  ha-card { font-size: clamp(18px, 3.4vmin, 44px) !important; }
                }
      
      styles:
        card:
          - background-color: '[[color_bg]]'
          - height: 100vh
          - width: 100vw
        # Default layout = portrait single column. The landscape (wide) two-column layout is
        # applied via a CSS @media query in the card_mod block above (#container override).
        grid:
          - display: grid
          - grid-template-rows: auto auto auto auto auto auto
          - grid-template-areas: |
              "date"
              "time"
              "temp"
              "climate"
              "climate_details"
              "forecast"
          - justify-items: center
          - align-content: center
        custom_fields:
          date:
            - grid-area: date
            - font-size: '[[font_date]]'
            - color: '[[color_primary]]'
            - text-transform: capitalize
          time:
            - grid-area: time
            - font-size: '[[font_time]]'
            - font-weight: 400
            - line-height: 1.1
            - margin-bottom: 6vh
            - color: '[[color_primary]]'
            - width: 80vw
            - text-align: center
          temp:
            - grid-area: temp
            - font-size: '[[font_temp]]'
            - color: '[[color_secondary]]'
            - margin-top: 2vh
          climate:
            - grid-area: climate
            - font-size: '[[font_climate]]'
            - color: '[[color_secondary]]'
            - margin-top: 2vh
          climate_details:
            - grid-area: climate_details
            - font-size: '[[font_climate_details]]'
            - color: '[[color_secondary]]'
            - margin-top: 0.5vh
          alarm:
            - position: absolute
            - top: 1vh
            - left: 5vh
            - font-size: '[[font_alarm]]'
            - color: '[[color_alarm]]'
            - z-index: 10
          charger_location:
            - position: absolute
            - top: 1vh
            - right: 5vh
            - font-size: 3vh
            - color: '[[color_secondary]]'
            - opacity: 0.6
            - z-index: 10
          forecast:
            - grid-area: forecast
            - width: 80vw
            - margin-top: 4vh
      
      # Tap interactions via browser_mod (passes device ID to scripts)
      tap_action:
        action: fire-dom-event
        browser_mod:
          service: script.screensaver_tap
          data:
            browser_id: THIS
        haptic: light

      double_tap_action:
        action: fire-dom-event
        browser_mod:
          service: script.screensaver_double_tap
          data:
            browser_id: THIS
        haptic: light

      hold_action:
        action: fire-dom-event
        browser_mod:
          service: script.screensaver_hold
          data:
            browser_id: THIS
        haptic: heavy

# -------------------------------------------------------------------------------------
# VIEWS
# -------------------------------------------------------------------------------------

views:
  - path: home
    panel: true  # Makes the card full-screen (important for wall tablets)
    cards:
      - type: custom:decluttering-card
        template: screensaver_template
        variables:
          - locale: *locale
          - color_bg: *color_bg
          - color_primary: *color_primary
          - color_secondary: *color_secondary
          - color_accent: *color_accent
          - color_alarm: *color_alarm
          - font_time: *font_time
          - font_date: *font_date
          - font_temp: *font_temp
          - font_temp_small: *font_temp_small
          - char_limit: *char_limit
          - font_climate: *font_climate
          - font_climate_details: *font_climate_details
          - font_alarm: *font_alarm
          - landscape_breakpoint: *landscape_breakpoint