<!DOCTYPE html>
<!--
  Car Screen: time, date and today's weather for a phone charging in the car, shown in Fully Kiosk.
  Self-contained: once loaded the clock runs with no network; the weather needs the phone's location
  (Fully Kiosk: Web Content Settings -> Enable Geolocation Access) and mobile data. No secrets
  (HA serves this file at /local/ without a login).

  Text follows the phone's language; nothing on screen is our own wording.
  URL parameter: ?home=<IANA zone>, e.g. ?home=Europe/Stockholm, shows the home time in a small
  footer whenever the phone's zone differs from it.
-->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Car Screen</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    /* Sized by the shorter side (vmin) so both orientations work, and capped by width (vw) so
       nothing overflows a narrow screen. Tabular digits stop the width jumping each minute. */
    #time {
      font-size: min(32vmin, 30vw);
      font-weight: 600;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    #date {
      margin-top: 3vmin;
      font-size: min(8vmin, 7vw);
      color: #bbb;
    }
    #weather {
      margin-top: 3vmin;
      font-size: min(6vmin, 5vw);
      color: #bbb;
      white-space: nowrap;
    }
    /* Bottom center: clear of a punch-hole camera, which sits top center in portrait and at a side
       in landscape. */
    #home {
      position: fixed;
      bottom: max(3vmin, env(safe-area-inset-bottom));
      left: 0;
      right: 0;
      text-align: center;
      font-size: min(4vmin, 4vw);
      color: #777;
    }
    /* Landscape (width >= 1.5x height), the same breakpoint as the home screensaver: the time
       can use most of the height. */
    @media (min-aspect-ratio: 3/2) {
      #time { font-size: min(50vmin, 30vw); }
    }
  </style>
</head>
<body>
  <div id="home"></div>
  <div id="time"></div>
  <div id="date"></div>
  <div id="weather"></div>
  <script>
    const WEATHER_REFRESH_MS = 30 * 60 * 1000;
    // A forecast older than this shows its age.
    const WEATHER_STALE_MS = 45 * 60 * 1000;
    // Less rain than this, in mm per hour, counts as none.
    const RAIN_THRESHOLD_MM = 0.1;

    // undefined = the phone's language and conventions (24- or 12-hour, word order).
    const timeFormat = new Intl.DateTimeFormat(undefined, { hour: '2-digit', minute: '2-digit' });
    const dateFormat = new Intl.DateTimeFormat(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
    const ageFormat = new Intl.RelativeTimeFormat(undefined, { numeric: 'auto', style: 'short' });

    const homeFormat = (() => {
      const zone = new URLSearchParams(location.search).get('home');
      if (!zone) return null;
      try {
        return new Intl.DateTimeFormat(undefined, { hour: '2-digit', minute: '2-digit', timeZone: zone });
      } catch (e) {
        return null; // Unknown zone name: no home time rather than a wrong one.
      }
    })();

    let forecast = null; // { line, fetchedAt }
    let lastWeatherAttempt = 0;

    // WMO weather codes, as returned by Open-Meteo.
    function weatherSymbol(code) {
      if (code === 0) return '☀️';
      if (code <= 2) return '🌤️';
      if (code === 3) return '☁️';
      if (code <= 48) return '🌫️';
      if (code <= 57) return '🌦️';
      if (code <= 67) return '🌧️';
      if (code <= 77) return '❄️';
      if (code <= 82) return '🌦️';
      if (code <= 86) return '🌨️';
      return '⛈️';
    }

    function forecastLine(data) {
      const daily = data.daily;
      const parts = [
        weatherSymbol(daily.weather_code[0]) + ' '
          + Math.round(daily.temperature_2m_min[0]) + '–' + Math.round(daily.temperature_2m_max[0]) + ' °C'
      ];

      // Rain still to come today: the amount from the current hour on, and when it starts. No start
      // time when it is already raining.
      const hourStart = Math.floor(Date.now() / 3600000) * 3600;
      let rain = 0;
      let rainStart = null;
      data.hourly.time.forEach((t, i) => {
        const mm = data.hourly.precipitation[i];
        if (t < hourStart || mm < RAIN_THRESHOLD_MM) return;
        rain += mm;
        if (rainStart === null) rainStart = t;
      });
      if (rain >= RAIN_THRESHOLD_MM) {
        let text = '💧 ' + (Math.round(rain * 10) / 10) + ' mm';
        if (rainStart > hourStart) text += ' · ' + timeFormat.format(new Date(rainStart * 1000));
        parts.push(text);
      }
      return parts.join(' · ');
    }

    function currentPosition() {
      return new Promise((resolve, reject) =>
        navigator.geolocation.getCurrentPosition(resolve, reject,
          { enableHighAccuracy: false, timeout: 20000, maximumAge: 10 * 60 * 1000 }));
    }

    // Keeps the last forecast on any failure; the clock never waits for this.
    async function updateWeather() {
      lastWeatherAttempt = Date.now();
      try {
        const position = await currentPosition();
        const url = 'https://api.open-meteo.com/v1/forecast'
          + '?latitude=' + position.coords.latitude.toFixed(3)
          + '&longitude=' + position.coords.longitude.toFixed(3)
          + '&daily=weather_code,temperature_2m_max,temperature_2m_min'
          + '&hourly=precipitation&forecast_days=1&timezone=auto&timeformat=unixtime';
        const response = await fetch(url);
        if (!response.ok) return;
        forecast = { line: forecastLine(await response.json()), fetchedAt: Date.now() };
        render();
      } catch (e) {
        // No position or no network: the previous forecast stays, and shows its age once stale.
      }
    }

    function weatherText() {
      if (!forecast) return '';
      const age = Date.now() - forecast.fetchedAt;
      if (age < WEATHER_STALE_MS) return forecast.line;
      const minutes = Math.round(age / 60000);
      const ageText = minutes < 60
        ? ageFormat.format(-minutes, 'minute')
        : ageFormat.format(-Math.round(minutes / 60), 'hour');
      return forecast.line + ' · ' + ageText;
    }

    function render() {
      const now = new Date();
      const local = timeFormat.format(now);
      document.getElementById('time').textContent = local;
      document.getElementById('date').textContent = dateFormat.format(now);
      document.getElementById('weather').textContent = weatherText();
      const home = homeFormat ? homeFormat.format(now) : null;
      document.getElementById('home').textContent = home && home !== local ? '🏠 ' + home : '';
    }

    // Re-render just after each minute boundary, rescheduling every time so timer drift never
    // accumulates. The weather refresh rides on the same tick.
    function tick() {
      render();
      if (Date.now() - lastWeatherAttempt >= WEATHER_REFRESH_MS) updateWeather();
      const now = new Date();
      setTimeout(tick, 60000 - now.getSeconds() * 1000 - now.getMilliseconds() + 50);
    }

    // Timers are throttled while the screen is off; catch up the moment it comes back.
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) return;
      render();
      if (Date.now() - lastWeatherAttempt >= WEATHER_REFRESH_MS) updateWeather();
    });

    tick();
  </script>
</body>
</html>
